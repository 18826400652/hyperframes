<!doctype html>
<html lang="zh-CN" data-composition-variables='[
  {"id":"label","type":"string","label":"说明","default":"单条视频最高播放量"},
  {"id":"value","type":"number","label":"目标数值","default":1286},
  {"id":"prefix","type":"string","label":"前缀","default":""},
  {"id":"suffix","type":"string","label":"单位","default":"万"},
  {"id":"delta","type":"string","label":"对比文案","default":"较上月 ↑ 320%"},
  {"id":"theme","type":"string","label":"主题(留空跟随全局)","default":""},
  {"id":"accent","type":"string","label":"主色(留空用主题色)","default":""}
]'>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; font-family: var(--hf-font-body); display: flex; align-items: center; justify-content: center; }
        #dy-stat-card { max-width: 960px; display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 56px 72px; border: 4px solid var(--hf-accent); }
        #dy-stat-label { max-width: 816px; text-align: center; font-size: 44px; line-height: 1.4; color: var(--hf-text); font-weight: 700; }
        #dy-stat-num { font-family: var(--hf-font-title); font-size: 220px; font-weight: 900; color: var(--hf-accent); line-height: 1.05; font-variant-numeric: tabular-nums; text-shadow: var(--hf-title-shadow); }
        #dy-stat-delta { max-width: 816px; text-align: center; font-size: 40px; font-weight: 800; line-height: 1.35; color: var(--hf-on-accent); background: var(--hf-accent); padding: 6px 24px; border-radius: 40px; }
      </style>
      <div id="root" data-composition-id="dy-stat-counter" data-width="1080" data-height="1920">
        <div class="hf-panel" id="dy-stat-card"><div id="dy-stat-label"></div><div id="dy-stat-num"></div><div id="dy-stat-delta"></div></div>
      </div>
      <script>
        const v = Object.assign({ label:"单条视频最高播放量", value:1286, prefix:"", suffix:"万", delta:"较上月 ↑ 320%", theme:"", accent:"" }, window.__hyperframes.getVariables());
        const root = document.getElementById("root");
        HF.applyTheme(root, v);
        const label = document.getElementById("dy-stat-label"), delta = document.getElementById("dy-stat-delta");
        label.textContent = v.label;
        if (v.delta) delta.textContent = v.delta; else delta.remove();
        const numEl = document.getElementById("dy-stat-num");
        const o = { n: 0 };
        const render = () => { numEl.textContent = v.prefix + Math.round(o.n).toLocaleString("en-US") + v.suffix; };
        render();
        // 按最终数值确定字号,计数过程中不再跳动
        HF.refit(() => {
          const keep = numEl.textContent;
          numEl.textContent = v.prefix + Math.round(Number(v.value)).toLocaleString("en-US") + v.suffix;
          HF.fit(numEl, 816, 72); numEl.textContent = keep;
          HF.fitLines(label, 2, 28);
          if (delta.isConnected) HF.fitLines(delta, 2, 28);
        });
        const D = HF.duration(root, 4.5);
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#dy-stat-card", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.6)" }, 0);
        tl.to(o, { n: Number(v.value), duration: 1.8, ease: "power3.out", onUpdate: render }, 0.3);
        if (delta.isConnected) tl.fromTo("#dy-stat-delta", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 1.9);
        tl.fromTo("#dy-stat-num", { scale: 1 }, { scale: 1.08, duration: 0.15, yoyo: true, repeat: 1 }, 2.1);
        tl.to("#dy-stat-card", { scale: 0.8, opacity: 0, duration: 0.35, ease: "power2.in" }, Math.max(2.5, D - 0.4));
        window.__timelines["dy-stat-counter"] = tl;
      </script>
    </template>
  </body>
</html>
