<!doctype html>
<html lang="zh-CN" data-composition-variables='[
  {"id": "kicker", "type": "string", "label": "小标签", "default": "AI 效率指南 · 07"},
  {"id": "title", "type": "string", "label": "标题", "default": "3 个 AI 工具让你下班提前 2 小时"},
  {"id": "em", "type": "string", "label": "强调词(标题中的一段)", "default": "提前 2 小时"},
  {"id": "sub", "type": "string", "label": "副标题", "default": "会议、PPT、邮件,一次讲清"},
  {"id": "theme", "type": "string", "label": "主题(留空跟随全局)", "default": ""},
  {"id": "accent", "type": "string", "label": "强调色(留空用主题色)", "default": ""}
]'>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; font-family: var(--hf-font-body); }
        #st-wrap { position: absolute; left: 80px; right: 160px; top: 560px; display: flex; flex-direction: column; align-items: flex-start; gap: 40px; }
        #st-title { width: 100%; font-size: 120px; }
        #st-sub { width: 100%; font-size: 44px; font-weight: 500; line-height: 1.45; color: var(--hf-muted); }
      </style>
      <div id="root" data-composition-id="scene-title" data-width="1080" data-height="1920">
        <div class="hf-bg"><i class="hf-bg-a"></i><i class="hf-bg-b"></i><i class="hf-bg-c"></i></div>
        <div id="st-wrap">
          <div class="hf-kicker" id="st-kicker"></div>
          <div class="hf-title" id="st-title"></div>
          <div class="hf-text" id="st-sub"></div>
        </div>
      </div>
      <script>
        const v = Object.assign({ kicker: "AI 效率指南 · 07", title: "3 个 AI 工具让你下班提前 2 小时", em: "提前 2 小时", sub: "会议、PPT、邮件,一次讲清", theme: "", accent: "" }, window.__hyperframes.getVariables());
        const root = document.getElementById("root");
        HF.applyTheme(root, v);
        const $ = id => document.getElementById(id);
        const title = $("st-title"), kicker = $("st-kicker"), sub = $("st-sub");

        // 标题:强调词是标题子串时就地包裹,否则追加到末尾
        const t = String(v.title), em = String(v.em || "");
        const at = em ? t.indexOf(em) : -1;
        const span = document.createElement("span");
        span.className = "hf-em"; span.textContent = em;
        if (at >= 0) { title.append(t.slice(0, at), span, t.slice(at + em.length)); }
        else { title.append(t); if (em) title.append(" ", span); }
        if (!em) span.remove();
        if (v.kicker) kicker.textContent = v.kicker; else kicker.remove();
        if (v.sub) sub.textContent = v.sub; else sub.remove();

        HF.refit(() => {
          span.style.whiteSpace = "";
          if (span.isConnected && span.offsetWidth > title.clientWidth) span.style.whiteSpace = "normal";
          if (kicker.isConnected) HF.fit(kicker, 840, 24);
          HF.fitLines(title, 3, 88);
          if (sub.isConnected) HF.fitLines(sub, 2, 32);
          HF.fitBox($("st-wrap"));
        });

        const m = HF.motion(root), D = HF.duration(root, 4);
        const parts = [kicker, title, sub].filter(e => e.isConnected);
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(parts, { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: m.dur, ease: m.ease, stagger: m.stagger }, 0.1);
        tl.to("#st-wrap", { y: -30, opacity: 0, duration: 0.3, ease: m.easeOut }, Math.max(0.8, D - 0.35));
        window.__timelines["scene-title"] = tl;
      </script>
    </template>
  </body>
</html>
