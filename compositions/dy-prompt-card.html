<!doctype html>
<html lang="zh-CN" data-composition-variables='[
  {"id": "title", "type": "string", "label": "标题", "default": "万能提示词模板"},
  {"id": "fields", "type": "string", "label": "字段(名称|内容;分行)", "default": "角色|你是一位资深短视频编导;任务|帮我写一条 30 秒口播脚本;要求|开头 3 秒抛钩子,口语化,结尾引导关注"},
  {"id": "cta", "type": "string", "label": "引导语", "default": "⭐ 收藏起来,下次直接复制"},
  {"id": "accent", "type": "color", "label": "主色", "default": "#7c5cff"}
]'>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "PingFang SC"; src: local("PingFang SC"), local("PingFangSC-Regular"); }
        @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"), local("微软雅黑"); }
        @font-face { font-family: "Noto Sans SC"; src: local("Noto Sans SC"), local("NotoSansSC-Regular"), local("Noto Sans CJK SC"); }
        @font-face { font-family: "WenQuanYi Zen Hei"; src: local("WenQuanYi Zen Hei"); }
        #root { position: absolute; inset: 0; font-family: "PingFang SC","Microsoft YaHei","Noto Sans SC","WenQuanYi Zen Hei",sans-serif; }
        #pr { position: absolute; left: 60px; right: 170px; top: 360px; padding: 44px; background: rgba(14,14,26,.93); border-radius: 40px; border: 3px solid var(--accent); box-shadow: 0 0 80px rgba(124,92,255,.3); }
        #pr-title { font-size: 62px; font-weight: 900; color: #fff; margin-bottom: 26px; } #pr-title b { color: var(--accent); }
        .pr-f { margin-bottom: 22px; padding: 22px 28px; border-radius: 24px; background: #20203a; border-left: 10px solid var(--accent); }
        .pr-k { font-size: 36px; font-weight: 900; color: var(--accent); margin-bottom: 8px; }
        .pr-v { font-size: 44px; font-weight: 700; color: #fff; line-height: 1.45; }
        #pr-cta { margin-top: 8px; text-align: center; font-size: 46px; font-weight: 900; color: #111; background: #ffe14d; border-radius: 40px; padding: 14px 0; }
      </style>
      <div id="root" data-composition-id="dy-prompt-card" data-width="1080" data-height="1920">
        <div id="pr"><div id="pr-title"></div><div id="pr-list"></div><div id="pr-cta"></div></div>
      </div>
      <script>
        const v = Object.assign({"title": "万能提示词模板", "fields": "角色|你是一位资深短视频编导;任务|帮我写一条 30 秒口播脚本;要求|开头 3 秒抛钩子,口语化,结尾引导关注", "cta": "⭐ 收藏起来,下次直接复制", "accent": "#7c5cff"}, window.__hyperframes.getVariables());
        const root = document.getElementById("root");
        root.style.setProperty("--accent", v.accent);
        document.getElementById("pr-title").innerHTML = "<b>/</b> " + String(v.title).replace(/</g, "&lt;");
        document.getElementById("pr-cta").textContent = v.cta;
        const fs = String(v.fields).split(";").filter(Boolean).map(r => r.split("|"));
        const list = document.getElementById("pr-list");
        fs.forEach((f, i) => { const el = document.createElement("div"); el.className = "pr-f"; el.id = "pr-f-" + i; el.innerHTML = '<div class="pr-k"></div><div class="pr-v"></div>'; el.children[0].textContent = "【" + f[0] + "】"; el.children[1].textContent = f[1] || ""; list.appendChild(el); });
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#pr", { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0);
        fs.forEach((_, i) => tl.fromTo("#pr-f-" + i, { x: -80, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.6 + i * 0.8));
        const te = 0.6 + fs.length * 0.8;
        tl.fromTo("#pr-cta", { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2)" }, te);
        tl.to("#pr-cta", { scale: 1.05, duration: 0.3, yoyo: true, repeat: 5, ease: "sine.inOut" }, te + 0.5);
        tl.to("#pr", { y: 40, opacity: 0, duration: 0.4, ease: "power2.in" }, te + 2.4);
        window.__timelines["dy-prompt-card"] = tl;
      </script>
    </template>
  </body>
</html>
