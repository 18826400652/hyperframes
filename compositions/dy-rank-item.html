<!doctype html>
<html lang="zh-CN" data-composition-variables='[
  {"id":"rank","type":"number","label":"名次","default":1},
  {"id":"title","type":"string","label":"标题","default":"苹果 iPhone 17"},
  {"id":"subtitle","type":"string","label":"说明","default":"销量冠军 · 好评率 98%"},
  {"id":"accent","type":"color","label":"主色","default":"#fe2c55"}
]'>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "PingFang SC"; src: local("PingFang SC"), local("PingFangSC-Regular"); }
        @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"), local("微软雅黑"); }
        @font-face { font-family: "Noto Sans SC"; src: local("Noto Sans SC"), local("NotoSansSC-Regular"), local("Noto Sans CJK SC"); }
        @font-face { font-family: "WenQuanYi Zen Hei"; src: local("WenQuanYi Zen Hei"); }
        #root { position: absolute; inset: 0; font-family: "PingFang SC","Microsoft YaHei","Noto Sans SC","WenQuanYi Zen Hei",sans-serif; }
        #dy-rank-wrap { position: absolute; left: 60px; right: 60px; top: 260px; display: flex; align-items: center; gap: 28px; }
        #dy-rank-badge { font-size: 170px; font-weight: 900; font-style: italic; color: var(--accent); line-height: 1; -webkit-text-stroke: 6px #fff; paint-order: stroke fill; text-shadow: 0 8px 0 rgba(0,0,0,.4); }
        #dy-rank-no { font-size: 44px; font-weight: 900; color: #fff; background: var(--accent); padding: 4px 14px; border-radius: 10px; align-self: flex-start; margin-top: 10px; }
        #dy-rank-text { display: flex; flex-direction: column; gap: 10px; background: rgba(15,15,20,.85); padding: 22px 32px; border-radius: 20px; border-left: 10px solid var(--accent); flex: 1; }
        #dy-rank-title { font-size: 58px; font-weight: 900; color: #fff; }
        #dy-rank-sub { font-size: 34px; color: #d0d0d8; }
      </style>
      <div id="root" data-composition-id="dy-rank-item" data-width="1080" data-height="1920">
        <div id="dy-rank-wrap">
          <div id="dy-rank-no">NO.</div>
          <div id="dy-rank-badge"></div>
          <div id="dy-rank-text"><div id="dy-rank-title"></div><div id="dy-rank-sub"></div></div>
        </div>
      </div>
      <script>
        const v = Object.assign({ rank:1, title:"苹果 iPhone 17", subtitle:"销量冠军 · 好评率 98%", accent:"#fe2c55" }, window.__hyperframes.getVariables());
        document.getElementById("root").style.setProperty("--accent", v.accent);
        document.getElementById("dy-rank-badge").textContent = v.rank;
        document.getElementById("dy-rank-title").textContent = v.title;
        document.getElementById("dy-rank-sub").textContent = v.subtitle;
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#dy-rank-no", { x: -300, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 0);
        tl.fromTo("#dy-rank-badge", { scale: 3, opacity: 0, rotation: -15 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.5, ease: "back.out(1.8)" }, 0.1);
        tl.fromTo("#dy-rank-text", { x: 500, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power4.out" }, 0.3);
        tl.to("#dy-rank-wrap", { y: -120, opacity: 0, duration: 0.35, ease: "power2.in" }, 3.5);
        window.__timelines["dy-rank-item"] = tl;
      </script>
    </template>
  </body>
</html>
