<!doctype html>
<html lang="zh-CN" data-composition-variables='[
  {"id":"likes","type":"number","label":"点赞数","default":128000},
  {"id":"comments","type":"number","label":"评论数","default":3568},
  {"id":"favs","type":"number","label":"收藏数","default":45200},
  {"id":"shares","type":"number","label":"转发数","default":9876}
]'>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "PingFang SC"; src: local("PingFang SC"), local("PingFangSC-Regular"); }
        @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"), local("微软雅黑"); }
        @font-face { font-family: "Noto Sans SC"; src: local("Noto Sans SC"), local("NotoSansSC-Regular"), local("Noto Sans CJK SC"); }
        @font-face { font-family: "WenQuanYi Zen Hei"; src: local("WenQuanYi Zen Hei"); }
        #root { position: absolute; inset: 0; font-family: "PingFang SC","Microsoft YaHei","Noto Sans SC","WenQuanYi Zen Hei",sans-serif; }
        #dy-action-bar-col { position: absolute; right: 28px; bottom: 460px; display: flex; flex-direction: column; align-items: center; gap: 44px; }
        .dy-ab-item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .dy-ab-icon { width: 96px; height: 96px; }
        .dy-ab-icon svg { width: 100%; height: 100%; filter: drop-shadow(0 3px 6px rgba(0,0,0,.5)); }
        .dy-ab-num { color: #fff; font-size: 30px; font-weight: 700; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
        #dy-action-bar-heart path { fill: #fff; }
      </style>
      <div id="root" data-composition-id="dy-action-bar" data-width="1080" data-height="1920">
        <div id="dy-action-bar-col">
          <div class="dy-ab-item" id="dy-ab-like"><div class="dy-ab-icon" id="dy-action-bar-heart"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.7 4.5 6.3 4.5c2 0 3.8 1.1 5.7 3.2 1.9-2.1 3.7-3.2 5.7-3.2 3.6 0 5.4 3.900 3.900 7.300C19.500 16.400 12 21 12 21z"/></svg></div><div class="dy-ab-num" id="dy-ab-n1">0</div></div>
          <div class="dy-ab-item" id="dy-ab-comment"><div class="dy-ab-icon"><svg viewBox="0 0 24 24"><path fill="#fff" d="M4 3h16a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H9l-5 4v-4H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><circle cx="8" cy="10.500" r="1.400" fill="#333"/><circle cx="12" cy="10.500" r="1.400" fill="#333"/><circle cx="16" cy="10.500" r="1.400" fill="#333"/></svg></div><div class="dy-ab-num" id="dy-ab-n2">0</div></div>
          <div class="dy-ab-item" id="dy-ab-fav"><div class="dy-ab-icon"><svg viewBox="0 0 24 24"><path fill="#fff" d="M12 2l3.100 6.300 6.900 1-5 4.900 1.200 6.900L12 17.800 5.800 21.100 7 14.200 2 9.300l6.900-1z"/></svg></div><div class="dy-ab-num" id="dy-ab-n3">0</div></div>
          <div class="dy-ab-item" id="dy-ab-share"><div class="dy-ab-icon"><svg viewBox="0 0 24 24"><path fill="#fff" d="M14 3l8 8-8 8v-5c-6 0-9.500 1.800-12 6 .800-7 4.500-11.500 12-12.200z"/></svg></div><div class="dy-ab-num" id="dy-ab-n4">0</div></div>
        </div>
      </div>
      <script>
        const v = Object.assign({ likes:128000, comments:3568, favs:45200, shares:9876 }, window.__hyperframes.getVariables());
        const fmt = (n) => n >= 10000 ? (n / 10000).toFixed(1).replace(/\.0$/, "") + "w" : String(Math.round(n));
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#dy-action-bar-col", { x: 200, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0);
        [["dy-ab-n1", v.likes, "#dy-ab-like"], ["dy-ab-n2", v.comments, "#dy-ab-comment"], ["dy-ab-n3", v.favs, "#dy-ab-fav"], ["dy-ab-n4", v.shares, "#dy-ab-share"]].forEach(([id, target, sel], i) => {
          const el = document.getElementById(id);
          const o = { n: 0 };
          const at = 0.5 + i * 0.12;
          tl.to(o, { n: target, duration: 1.6, ease: "power2.out", onUpdate: () => { el.textContent = fmt(o.n); } }, at);
          tl.fromTo(sel + " .dy-ab-icon", { scale: 1 }, { scale: 1.35, duration: 0.18, yoyo: true, repeat: 1, ease: "power2.out" }, at + 0.1);
        });
        tl.to("#dy-action-bar-heart path", { fill: "#fe2c55", duration: 0.12 }, 0.65);
        tl.fromTo("#dy-ab-like .dy-ab-icon", { rotation: 0 }, { rotation: -12, duration: 0.1, yoyo: true, repeat: 3 }, 2.4);
        tl.to("#dy-action-bar-col", { x: 200, opacity: 0, duration: 0.4, ease: "power3.in" }, 4.4);
        window.__timelines["dy-action-bar"] = tl;
      </script>
    </template>
  </body>
</html>
