<!doctype html>
<html lang="zh-CN" data-composition-variables='[
  {"id": "leftName", "type": "string", "label": "左侧名称", "default": "方案 A"},
  {"id": "rightName", "type": "string", "label": "右侧名称", "default": "方案 B"},
  {"id": "rows", "type": "string", "label": "对比行(项目|左|右|胜方L或R;用分号分行)", "default": "价格|¥99|¥299|L;续航|8小时|20小时|R;重量|180g|210g|L"},
  {"id": "theme", "type": "string", "label": "主题(留空跟随全局)", "default": ""},
  {"id": "leftColor", "type": "string", "label": "左侧色(留空用主题辅色)", "default": ""},
  {"id": "accent", "type": "string", "label": "右侧色(留空用主题色)", "default": ""},
  {"id": "cues", "type": "string", "label": "节拍(秒,| 分隔:每一行对比出现的时间;留空按默认节奏铺满整段)", "default": ""}
]'>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; font-family: var(--hf-font-body); }
        #vs { position: absolute; left: 60px; right: 60px; top: 380px; display: flex; flex-direction: column; gap: 22px; }
        #vs-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
        .vs-name { flex: 1; min-width: 0; text-align: center; font-family: var(--hf-font-title); font-size: 60px; font-weight: var(--hf-title-weight); line-height: 1.25; padding: 20px 16px; border-radius: var(--hf-radius); }
        #vs-l { background: var(--hf-accent-2); color: var(--hf-on-accent-2); }
        #vs-r { background: var(--hf-accent); color: var(--hf-on-accent); }
        #vs-badge { flex: none; width: 130px; height: 130px; margin: 0 -10px; z-index: 2; border-radius: 50%; background: var(--hf-text); color: var(--hf-bg); font-family: var(--hf-font-title); font-size: 60px; font-weight: 900; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 8px var(--hf-bg); }
        #vs-rows { display: flex; flex-direction: column; gap: 22px; }
        .vs-row { display: flex; align-items: stretch; gap: 14px; }
        .vs-cell { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 54px; font-weight: 900; line-height: 1.25; color: var(--hf-text); padding: 26px 12px; }
        .vs-cell.vs-win-l { border: 4px solid var(--hf-accent-2); box-shadow: 0 0 40px color-mix(in srgb, var(--hf-accent-2) 60%, transparent); }
        .vs-cell.vs-win-r { border: 4px solid var(--hf-accent); box-shadow: 0 0 40px color-mix(in srgb, var(--hf-accent) 60%, transparent); }
        .vs-lab { flex: none; width: 180px; text-align: center; align-self: center; font-size: 38px; font-weight: 700; line-height: 1.3; color: var(--hf-text); -webkit-text-stroke: 6px var(--hf-bg); paint-order: stroke fill; }
      </style>
      <div id="root" data-composition-id="dy-vs-compare" data-width="1080" data-height="1920">
        <div id="vs"><div id="vs-head"><div class="vs-name" id="vs-l"></div><div id="vs-badge">VS</div><div class="vs-name" id="vs-r"></div></div><div id="vs-rows"></div></div>
      </div>
      <script>
        const v = Object.assign({"leftName": "方案 A", "rightName": "方案 B", "rows": "价格|¥99|¥299|L;续航|8小时|20小时|R;重量|180g|210g|L", "theme": "", "leftColor": "", "accent": "", "cues": ""}, window.__hyperframes.getVariables());
        const root = document.getElementById("root");
        HF.applyTheme(root, { theme: v.theme, accent: v.accent, accent2: v.leftColor });
        const L = document.getElementById("vs-l"), R = document.getElementById("vs-r");
        L.textContent = v.leftName; R.textContent = v.rightName;
        const rows = HF.split(v.rows, ";").map(r => r.split("|"));
        const box = document.getElementById("vs-rows");
        rows.forEach((r, i) => {
          const el = document.createElement("div"); el.className = "vs-row"; el.id = "vs-row-" + i;
          const mk = (cls, txt) => { const d = document.createElement("div"); d.className = cls; d.textContent = txt || ""; return d; };
          const a = mk("vs-cell hf-panel", r[1]), lab = mk("vs-lab", r[0]), b = mk("vs-cell hf-panel", r[2]);
          if (r[3] === "L") a.classList.add("vs-win-l");
          if (r[3] === "R") b.classList.add("vs-win-r");
          el.append(a, lab, b); box.appendChild(el);
        });
        HF.refit(() => {
          HF.fitLines(L, 2, 30); HF.fitLines(R, 2, 30);
          box.querySelectorAll(".vs-cell").forEach(c => HF.fitLines(c, 2, 30));
          box.querySelectorAll(".vs-lab").forEach(c => HF.fitLines(c, 3, 24));
          HF.fitBox(document.getElementById("vs"));
        });
        const D = HF.duration(root, 6);
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#vs-l", { x: -300, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0);
        tl.fromTo("#vs-r", { x: 300, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0);
        tl.fromTo("#vs-badge", { scale: 0, rotate: -90 }, { scale: 1, rotate: 0, duration: 0.5, ease: "back.out(2)" }, 0.3);
        const at = HF.cues(v.cues, rows.length, rows.map((_, i) => 0.9 + i * 0.6));
        rows.forEach((_, i) => tl.fromTo("#vs-row-" + i, { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, at[i]));
        tl.to("#vs", { opacity: 0, y: -40, duration: 0.4, ease: "power2.in" }, Math.max((rows.length ? at[rows.length - 1] : 0.9) + 0.5, D - 0.5));
        window.__timelines["dy-vs-compare"] = tl;
      </script>
    </template>
  </body>
</html>
