<!doctype html>
<html lang="zh-CN" data-composition-variables='[
  {"id": "title", "type": "string", "label": "标题", "default": "这 3 个,直接用"},
  {"id": "items", "type": "string", "label": "要点(| 分隔;每条可写 标题::说明)", "default": "会议纪要::录音上传,自动整理待办|PPT 初稿::一句话主题,生成整套页面|邮件润色::语气、长度,一键改写"},
  {"id": "theme", "type": "string", "label": "主题(留空跟随全局)", "default": ""},
  {"id": "accent", "type": "string", "label": "强调色(留空用主题色)", "default": ""}
]'>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; font-family: var(--hf-font-body); }
        #sp-wrap { position: absolute; left: 80px; right: 160px; top: 400px; display: flex; flex-direction: column; gap: 48px; }
        #sp-title { font-size: 88px; }
        #sp-list { display: flex; flex-direction: column; gap: 24px; }
        .sp-item { display: flex; align-items: flex-start; gap: 32px; padding: 32px 40px; }
        .sp-num { flex: none; min-width: 72px; font-family: var(--hf-font-title); font-size: 60px; font-weight: var(--hf-title-weight); line-height: 1; color: var(--hf-accent); }
        .sp-body { flex: 1; min-width: 0; }
        .sp-head { font-size: 44px; font-weight: 800; line-height: 1.3; }
        .sp-desc { margin-top: 8px; font-size: 32px; font-weight: 500; line-height: 1.5; color: var(--hf-muted); }
      </style>
      <div id="root" data-composition-id="dy-scene-points" data-width="1080" data-height="1920">
        <div class="hf-bg"><i class="hf-bg-a"></i><i class="hf-bg-b"></i><i class="hf-bg-c"></i></div>
        <div id="sp-wrap">
          <div class="hf-title" id="sp-title"></div>
          <div id="sp-list"></div>
        </div>
      </div>
      <script>
        const v = Object.assign({ title: "这 3 个,直接用", items: "会议纪要::录音上传,自动整理待办|PPT 初稿::一句话主题,生成整套页面|邮件润色::语气、长度,一键改写", theme: "", accent: "" }, window.__hyperframes.getVariables());
        const root = document.getElementById("root");
        HF.applyTheme(root, v);
        const title = document.getElementById("sp-title"), list = document.getElementById("sp-list");
        if (v.title) title.textContent = v.title; else title.remove();

        const rows = HF.split(v.items).map((raw, i) => {
          const [head, desc] = HF.pair(raw);
          const row = document.createElement("div"); row.className = "sp-item hf-card";
          const num = document.createElement("div"); num.className = "sp-num"; num.textContent = String(i + 1).padStart(2, "0");
          const body = document.createElement("div"); body.className = "sp-body hf-text";
          const h = document.createElement("div"); h.className = "sp-head"; h.textContent = head; body.append(h);
          if (desc) { const d = document.createElement("div"); d.className = "sp-desc"; d.textContent = desc; body.append(d); }
          row.append(num, body); list.append(row);
          return row;
        });

        HF.refit(() => {
          if (title.isConnected) HF.fitLines(title, 2, 60);
          HF.centerBox(document.getElementById("sp-wrap"));
        });

        const m = HF.motion(root), D = HF.duration(root, 6);
        const tl = gsap.timeline({ paused: true });
        if (title.isConnected) tl.fromTo(title, { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: m.dur, ease: m.ease }, 0.1);
        // 要点在前 60% 时长内逐条出现(至少间隔 stagger)
        const gap = Math.max(m.stagger, Math.min(0.8, (D * 0.6 - 0.5) / Math.max(1, rows.length)));
        rows.forEach((row, i) => tl.fromTo(row, { x: -60, opacity: 0 }, { x: 0, opacity: 1, duration: m.dur, ease: m.ease }, 0.4 + i * gap));
        tl.to("#sp-wrap", { y: -30, opacity: 0, duration: 0.3, ease: m.easeOut }, Math.max(0.4 + rows.length * gap + m.dur, D - 0.35));
        window.__timelines["dy-scene-points"] = tl;
      </script>
    </template>
  </body>
</html>
