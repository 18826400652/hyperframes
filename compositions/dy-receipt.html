<!doctype html>
<html lang="zh-CN" data-composition-variables='[
  {"id": "title", "type": "string", "label": "小票标题", "default": "反馈分类 · DeepSeek"},
  {"id": "sub", "type": "string", "label": "副标题(可选)", "default": "客户反馈 20 条"},
  {"id": "rows", "type": "string", "label": "明细(| 分隔;每行写 名称::编号::数量)", "default": "涂层脱落::3·7·14::3|售后太慢::4·10·15::3|清洗困难::9·17·20::3|噪音大::5·11·18::3|好评小问题::5·20::2"},
  {"id": "total", "type": "string", "label": "合计(可选)", "default": "合计 22 条"},
  {"id": "verdict", "type": "string", "label": "合计判定(wrong 标错 / right 标对 / 留空不标)", "default": "wrong"},
  {"id": "dup", "type": "string", "label": "要圈出的编号(逗号分隔,可选)", "default": "5,20"},
  {"id": "check", "type": "string", "label": "末尾附加行(可选)", "default": ""},
  {"id": "theme", "type": "string", "label": "主题(留空跟随全局)", "default": ""},
  {"id": "accent", "type": "string", "label": "强调色(留空用主题色)", "default": ""},
  {"id": "cues", "type": "string", "label": "节拍(秒,| 分隔:打印完、标出重复和结论的时间;留空按默认节奏铺满整段)", "default": ""}
]'>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; font-family: var(--hf-font-body); }
        /* 热敏小票:纸色用主题文字色、字用主题底色,任何主题下都是高对比的一张纸 */
        #rc { position: absolute; left: 160px; width: 680px; top: 360px; padding: 40px 40px 52px; background: var(--hf-text); color: var(--hf-bg); box-shadow: var(--hf-surface-shadow);
          -webkit-mask: linear-gradient(black, black) top / 100% calc(100% - 16px) no-repeat, conic-gradient(from -45deg at bottom, transparent, black 1deg 89deg, transparent 90deg) bottom / 32px 16px repeat-x;
                  mask: linear-gradient(black, black) top / 100% calc(100% - 16px) no-repeat, conic-gradient(from -45deg at bottom, transparent, black 1deg 89deg, transparent 90deg) bottom / 32px 16px repeat-x; }
        #rc-title { font-family: var(--hf-font-title); font-size: 44px; font-weight: var(--hf-title-weight); line-height: 1.25; overflow-wrap: anywhere; }
        #rc-sub { margin-top: 6px; font-family: var(--hf-font-mono); font-size: 28px; line-height: 1.4; opacity: 0.7; overflow-wrap: anywhere; }
        .rc-rule { margin: 18px 0; border-top: 3px dashed currentColor; opacity: 0.5; }
        .rc-row { display: flex; align-items: baseline; gap: 18px; font-size: 34px; line-height: 1.55; }
        .rc-k { flex: none; width: 48px; font-family: var(--hf-font-mono); opacity: 0.6; }
        .rc-n { flex: 1; min-width: 0; font-weight: 800; overflow-wrap: anywhere; }
        .rc-ids { flex: none; max-width: 230px; font-family: var(--hf-font-mono); overflow-wrap: anywhere; }
        .rc-c { flex: none; min-width: 48px; text-align: right; font-family: var(--hf-font-mono); font-weight: 700; }
        .rc-ids i { font-style: normal; position: relative; }
        .rc-ids i.dup::after { content: ""; position: absolute; left: -6px; right: -6px; top: 0; bottom: 0; border: 4px solid var(--hf-accent-2); border-radius: 8px; opacity: var(--box, 0); }
        #rc-total { display: flex; justify-content: space-between; gap: 20px; padding: 12px 16px; font-family: var(--hf-font-title); font-size: 56px; font-weight: 900; line-height: 1.2; border-radius: calc(var(--hf-radius) * 0.3); }
        #rc-check { margin-top: 18px; padding: 12px 16px; border: 4px solid currentColor; font-size: 32px; font-weight: 800; line-height: 1.4; overflow-wrap: anywhere; }
      </style>
      <div id="root" data-composition-id="dy-receipt" data-width="1080" data-height="1920">
        <div id="rc">
          <div id="rc-title"></div>
          <div id="rc-sub"></div>
          <div class="rc-rule"></div>
          <div id="rc-rows"></div>
          <div class="rc-rule" id="rc-rule2"></div>
          <div id="rc-total"><span id="rc-tl"></span><span id="rc-tv"></span></div>
          <div id="rc-check"></div>
        </div>
      </div>
      <script>
        const v = Object.assign({ title: "反馈分类 · DeepSeek", sub: "客户反馈 20 条", rows: "涂层脱落::3·7·14::3|售后太慢::4·10·15::3|清洗困难::9·17·20::3|噪音大::5·11·18::3|好评小问题::5·20::2", total: "合计 22 条", verdict: "wrong", dup: "5,20", check: "", theme: "", accent: "" , "cues": ""}, window.__hyperframes.getVariables());
        const root = document.getElementById("root");
        HF.applyTheme(root, v);
        const $ = (id) => document.getElementById(id);
        if (v.title) $("rc-title").textContent = v.title; else $("rc-title").remove();
        if (v.sub) $("rc-sub").textContent = v.sub; else $("rc-sub").remove();

        // 明细:编号按「·、, 空格」切开,要圈的编号包一层 <i class="dup">
        const dups = new Set(String(v.dup).split(/[,，、\s]+/).filter(Boolean));
        const rows = HF.split(v.rows).map((raw, i) => {
          const [name = "", ids = "", count = ""] = raw.split("::").map((s) => s.trim());
          const row = document.createElement("div"); row.className = "rc-row";
          const k = document.createElement("span"); k.className = "rc-k"; k.textContent = String(i + 1).padStart(2, "0");
          const n = document.createElement("span"); n.className = "rc-n"; n.textContent = name;
          const idEl = document.createElement("span"); idEl.className = "rc-ids";
          ids.split(/([·、,，\s]+)/).forEach((part) => {
            if (dups.has(part)) { const m = document.createElement("i"); m.className = "dup"; m.textContent = part; idEl.append(m); }
            else idEl.append(part);
          });
          const c = document.createElement("span"); c.className = "rc-c"; c.textContent = count;
          row.append(k, n, idEl, c); $("rc-rows").append(row);
          return row;
        });

        // 合计:「合计 22 条」拆成左右两半(第一个空格处)
        const total = String(v.total).trim();
        if (total) { const sp = total.indexOf(" "); $("rc-tl").textContent = sp > 0 ? total.slice(0, sp) : total; $("rc-tv").textContent = sp > 0 ? total.slice(sp + 1) : ""; }
        else { $("rc-total").remove(); $("rc-rule2").remove(); }
        if (v.check) $("rc-check").textContent = v.check; else $("rc-check").remove();
        const verdict = { wrong: ["var(--hf-accent-2)", "var(--hf-on-accent-2)"], right: ["var(--hf-accent)", "var(--hf-on-accent)"] }[v.verdict];

        HF.refit(() => {
          if ($("rc-title")) HF.fitLines($("rc-title"), 2, 32);
          rows.forEach((r) => HF.fitLines(r.querySelector(".rc-n"), 2, 26));
          if ($("rc-total")) HF.fit($("rc-total"), 0, 36);
          HF.centerBox($("rc"));
        });

        const m = HF.motion(root), D = HF.duration(root, 5);
        const tl = gsap.timeline({ paused: true });
        // 打印:从上往下逐渐露出(占前 35% 时长)
        const printEnd = Math.max(0.8, D * 0.35);
        tl.fromTo("#rc", { clipPath: "inset(0 0 100% 0)" }, { clipPath: "inset(0 0 0% 0)", duration: printEnd - 0.1, ease: "none" }, 0.1);
        let [t] = HF.cues(v.cues, 1, [printEnd + 0.2]);
        t = Math.max(t, printEnd);
        const marks = root.querySelectorAll(".rc-ids i.dup");
        if (marks.length) {
          tl.fromTo(marks, { "--box": 0 }, { "--box": 1, duration: 0.15 }, t);
          tl.fromTo(marks, { scale: 1 }, { scale: 1.25, duration: 0.12, yoyo: true, repeat: 1 }, t);
          t += 0.5;
        }
        if (verdict && $("rc-total")) {
          tl.fromTo("#rc-total", { backgroundColor: "rgba(0, 0, 0, 0)" }, { backgroundColor: verdict[0], color: verdict[1], duration: 0.2 }, t);
          tl.fromTo("#rc-total", { scale: 1 }, { scale: 1.05, duration: 0.12, yoyo: true, repeat: 1 }, t);
          t += 0.4;
        }
        if ($("rc-check")) { tl.fromTo("#rc-check", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: m.dur, ease: m.ease }, t); t += m.dur; }
        tl.to("#rc", { y: -30, opacity: 0, duration: 0.3, ease: m.easeOut }, Math.max(t + 0.3, D - 0.35));
        window.__timelines["dy-receipt"] = tl;
      </script>
    </template>
  </body>
</html>
