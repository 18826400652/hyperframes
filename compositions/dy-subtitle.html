<!doctype html>
<html lang="zh-CN" data-composition-variables='[
  {"id":"lines","type":"string","label":"字幕(用|分隔多句)","default":"今天教你三个涨粉技巧|第一招:前三秒必须有钩子|第二招:评论区自己先留言"},
  {"id":"secondsPerLine","type":"number","label":"每句秒数","default":2},
  {"id":"keyColor","type":"color","label":"高亮色","default":"#ffe14d"}
]'>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "PingFang SC"; src: local("PingFang SC"), local("PingFangSC-Regular"); }
        @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"), local("微软雅黑"); }
        @font-face { font-family: "Noto Sans SC"; src: local("Noto Sans SC"), local("NotoSansSC-Regular"), local("Noto Sans CJK SC"); }
        @font-face { font-family: "WenQuanYi Zen Hei"; src: local("WenQuanYi Zen Hei"); }
        #root { position: absolute; inset: 0; font-family: "PingFang SC","Microsoft YaHei","Noto Sans SC","WenQuanYi Zen Hei",sans-serif; }
        #dy-subtitle-box { position: absolute; left: 80px; right: 80px; bottom: 520px; height: 260px; display: flex; align-items: flex-end; justify-content: center; }
        .dy-sub-line { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; font-size: 72px; font-weight: 900; line-height: 1.3; color: #fff; -webkit-text-stroke: 10px #000; paint-order: stroke fill; letter-spacing: 3px; opacity: 0; }
        .dy-sub-ch { display: inline-block; }
      </style>
      <div id="root" data-composition-id="dy-subtitle" data-width="1080" data-height="1920">
        <div id="dy-subtitle-box"></div>
      </div>
      <script>
        const v = Object.assign({ lines:"今天教你三个涨粉技巧|第一招:前三秒必须有钩子|第二招:评论区自己先留言", secondsPerLine:2, keyColor:"#ffe14d" }, window.__hyperframes.getVariables());
        const box = document.getElementById("dy-subtitle-box");
        const lines = String(v.lines).split("|").filter(Boolean);
        const per = Number(v.secondsPerLine);
        const tl = gsap.timeline({ paused: true });
        lines.forEach((text, i) => {
          const div = document.createElement("div");
          div.className = "dy-sub-line";
          div.id = "dy-sub-line-" + i;
          const chars = Array.from(text);
          chars.forEach((c, k) => { const s = document.createElement("span"); s.className = "dy-sub-ch"; s.textContent = c === " " ? " " : c; s.id = "dy-sub-" + i + "-" + k; div.appendChild(s); });
          box.appendChild(div);
          const t0 = i * per;
          const step = Math.max(0.03, (per - 0.4) / chars.length);
          tl.fromTo(div, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.2, ease: "power2.out" }, t0);
          chars.forEach((c, k) => {
            tl.to("#dy-sub-" + i + "-" + k, { color: v.keyColor, duration: 0.08 }, t0 + 0.1 + k * step);
            tl.fromTo("#dy-sub-" + i + "-" + k, { scale: 1 }, { scale: 1.15, duration: 0.1, yoyo: true, repeat: 1 }, t0 + 0.1 + k * step);
          });
          tl.to(div, { opacity: 0, duration: 0.15 }, t0 + per - 0.15);
        });
        window.__timelines["dy-subtitle"] = tl;
      </script>
    </template>
  </body>
</html>
