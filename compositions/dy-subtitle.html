<!doctype html>
<html lang="zh-CN" data-composition-variables='[
  {"id":"lines","type":"string","label":"字幕(用|分隔多句)","default":"今天教你三个涨粉技巧|第一招:前三秒必须有钩子|第二招:评论区自己先留言"},
  {"id":"secondsPerLine","type":"number","label":"每句秒数","default":2},
  {"id":"theme","type":"string","label":"主题(留空跟随全局)","default":""},
  {"id":"keyColor","type":"string","label":"高亮色(留空用主题强调色)","default":""}
]'>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; font-family: var(--hf-font-body); }
        #dy-subtitle-box { position: absolute; left: 80px; right: 80px; bottom: 520px; height: 260px; display: flex; align-items: flex-end; justify-content: center; }
        .dy-sub-line { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; font-size: 72px; font-weight: 900; line-height: 1.3; color: var(--hf-text); -webkit-text-stroke: 10px var(--hf-bg); paint-order: stroke fill; letter-spacing: 3px; opacity: 0; }
        .dy-sub-ch { display: inline-block; }
      </style>
      <div id="root" data-composition-id="dy-subtitle" data-width="1080" data-height="1920">
        <div id="dy-subtitle-box"></div>
      </div>
      <script>
        const v = Object.assign({ lines:"今天教你三个涨粉技巧|第一招:前三秒必须有钩子|第二招:评论区自己先留言", secondsPerLine:2, theme:"", keyColor:"" }, window.__hyperframes.getVariables());
        const root = document.getElementById("root");
        HF.applyTheme(root, v);
        // 逐字高亮色:合法的变量值优先,否则取主题强调色(GSAP 需要具体颜色值)
        const key = (v.keyColor && CSS.supports("color", v.keyColor)) ? v.keyColor : getComputedStyle(root).getPropertyValue("--hf-accent").trim();
        const box = document.getElementById("dy-subtitle-box");
        const lines = HF.split(v.lines);
        const per = Math.max(0.6, Number(v.secondsPerLine) || 2);
        const divs = [];
        const tl = gsap.timeline({ paused: true });
        lines.forEach((text, i) => {
          const div = document.createElement("div");
          div.className = "dy-sub-line";
          div.id = "dy-sub-line-" + i;
          const chars = Array.from(text);
          chars.forEach((c, k) => { const s = document.createElement("span"); s.className = "dy-sub-ch"; s.textContent = c === " " ? " " : c; s.id = "dy-sub-" + i + "-" + k; div.appendChild(s); });
          box.appendChild(div); divs.push(div);
          const t0 = i * per;
          const step = Math.max(0.03, (per - 0.4) / chars.length);
          tl.fromTo(div, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.2, ease: "power2.out" }, t0);
          chars.forEach((c, k) => {
            tl.to("#dy-sub-" + i + "-" + k, { color: key, duration: 0.08 }, t0 + 0.1 + k * step);
            tl.fromTo("#dy-sub-" + i + "-" + k, { scale: 1 }, { scale: 1.15, duration: 0.1, yoyo: true, repeat: 1 }, t0 + 0.1 + k * step);
          });
          tl.to(div, { opacity: 0, duration: 0.15 }, t0 + per - 0.15);
        });
        // 长句最多两行,超出时缩小字号
        HF.refit(() => divs.forEach(d => HF.fitLines(d, 2, 44)));
        window.__timelines["dy-subtitle"] = tl;
      </script>
    </template>
  </body>
</html>
