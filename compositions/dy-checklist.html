<!doctype html>
<html lang="zh-CN" data-composition-variables='[
  {"id": "title", "type": "string", "label": "标题", "default": "记住这 3 点"},
  {"id": "items", "type": "string", "label": "要点(| 分隔)", "default": "别盲目跟风|先测试再放量|数据比感觉靠谱"},
  {"id": "accent", "type": "color", "label": "主色", "default": "#25f4ee"}
]'>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Noto Sans SC Variable"; src: local("Noto Sans SC Variable"); }
        @font-face { font-family: "PingFang SC"; src: local("PingFang SC"), local("PingFangSC-Regular"); }
        @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"), local("微软雅黑"); }
        @font-face { font-family: "Noto Sans SC"; src: local("Noto Sans SC"), local("NotoSansSC-Regular"), local("Noto Sans CJK SC"); }
        @font-face { font-family: "WenQuanYi Zen Hei"; src: local("WenQuanYi Zen Hei"); }
        #root { position: absolute; inset: 0; font-family: "Noto Sans SC Variable","PingFang SC","Microsoft YaHei","Noto Sans SC","WenQuanYi Zen Hei",sans-serif; }
        #ck { position: absolute; left: 70px; right: 170px; top: 520px; padding: 48px 48px 40px; background: rgba(12,12,18,.9); border-radius: 40px; border: 4px solid var(--accent); box-shadow: 0 0 80px rgba(37,244,238,.2); }
        #ck-title { font-size: 66px; font-weight: 900; color: var(--accent); margin-bottom: 18px; }
        .ck-item { display: flex; align-items: center; gap: 28px; padding: 22px 0; font-size: 54px; font-weight: 800; color: #fff; }
        .ck-box { flex: none; width: 70px; height: 70px; border-radius: 18px; border: 5px solid var(--accent); display: flex; align-items: center; justify-content: center; }
        .ck-box svg { width: 48px; height: 48px; }
        .ck-box path { fill: none; stroke: var(--accent); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 40; stroke-dashoffset: 40; }
      </style>
      <div id="root" data-composition-id="dy-checklist" data-width="1080" data-height="1920">
        <div id="ck"><div id="ck-title"></div><div id="ck-list"></div></div>
      </div>
      <script>
        const hfFit = (el, maxW, minPx) => { el.style.fontSize = ""; el.style.whiteSpace = "nowrap"; const over = () => maxW ? el.scrollWidth > maxW : el.scrollWidth > el.clientWidth + 1; let fs = parseFloat(getComputedStyle(el).fontSize); while (over() && fs > minPx) { fs -= 2; el.style.fontSize = fs + "px"; } if (over()) el.style.whiteSpace = "normal"; };
        const hfFitBox = (el, bottom, minTop = 260) => { el.style.scale = ""; el.style.top = ""; const h = el.offsetHeight; if (el.offsetTop + h <= bottom) return; const top = Math.max(minTop, bottom - h); el.style.top = top + "px"; if (top + h > bottom) { el.style.transformOrigin = "50% 0"; el.style.scale = String(Math.max(0.5, (bottom - top) / h)); } };
        const v = Object.assign({"title": "记住这 3 点", "items": "别盲目跟风|先测试再放量|数据比感觉靠谱", "accent": "#25f4ee"}, window.__hyperframes.getVariables());
        const root = document.getElementById("root");
        root.style.setProperty("--accent", v.accent);
        document.getElementById("ck-title").textContent = v.title;
        const items = String(v.items).split("|").filter(Boolean);
        const list = document.getElementById("ck-list");
        items.forEach((t, i) => {
          const el = document.createElement("div"); el.className = "ck-item"; el.id = "ck-item-" + i;
          el.innerHTML = '<div class="ck-box"><svg viewBox="0 0 48 48"><path id="ck-p-' + i + '" d="M8 25 L19 36 L40 12"/></svg></div><div class="ck-t"></div>';
          el.querySelector(".ck-t").textContent = t; list.appendChild(el);
        });
        const hfRefit = () => { hfFitBox(document.getElementById("ck"), 1520); };
        hfRefit(); if (document.fonts) document.fonts.ready.then(hfRefit);
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#ck", { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0);
        items.forEach((_, i) => {
          const t = 0.7 + i * 1.2;
          tl.fromTo("#ck-item-" + i, { x: -60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, t);
          tl.to("#ck-p-" + i, { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, t + 0.45);
          tl.fromTo("#ck-item-" + i + " .ck-box", { scale: 1 }, { scale: 1.2, duration: 0.12, yoyo: true, repeat: 1 }, t + 0.5);
        });
        tl.to("#ck", { y: 40, opacity: 0, duration: 0.4, ease: "power2.in" }, 0.7 + items.length * 1.2 + 0.8);
        window.__timelines["dy-checklist"] = tl;
      </script>
    </template>
  </body>
</html>
