<!doctype html>
<html lang="zh-CN" data-composition-variables='[
  {"id": "title", "type": "string", "label": "标题", "default": "记住这 3 点"},
  {"id": "items", "type": "string", "label": "要点(| 分隔)", "default": "别盲目跟风|先测试再放量|数据比感觉靠谱"},
  {"id": "theme", "type": "string", "label": "主题(留空跟随全局)", "default": ""},
  {"id": "accent", "type": "string", "label": "主色(留空用主题色)", "default": ""},
  {"id": "cues", "type": "string", "label": "节拍(秒,| 分隔:每一项出现的时间;留空按默认节奏铺满整段)", "default": ""}
]'>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; font-family: var(--hf-font-body); }
        #ck { position: absolute; left: 70px; right: 170px; top: 520px; padding: 48px 48px 40px; border: 4px solid var(--hf-accent); }
        #ck-title { font-family: var(--hf-font-title); font-size: 66px; font-weight: var(--hf-title-weight); line-height: 1.25; color: var(--hf-accent); margin-bottom: 18px; }
        .ck-item { display: flex; align-items: center; gap: 28px; padding: 22px 0; font-size: 54px; font-weight: 800; line-height: 1.3; color: var(--hf-text); }
        .ck-t { flex: 1; min-width: 0; }
        .ck-box { flex: none; width: 70px; height: 70px; border-radius: calc(var(--hf-radius) * 0.6); border: 5px solid var(--hf-accent); display: flex; align-items: center; justify-content: center; }
        .ck-box svg { width: 48px; height: 48px; }
        .ck-box path { fill: none; stroke: var(--hf-accent); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 40; stroke-dashoffset: 40; }
      </style>
      <div id="root" data-composition-id="dy-checklist" data-width="1080" data-height="1920">
        <div class="hf-panel" id="ck"><div id="ck-title"></div><div id="ck-list"></div></div>
      </div>
      <script>
        const v = Object.assign({"title": "记住这 3 点", "items": "别盲目跟风|先测试再放量|数据比感觉靠谱", "theme": "", "accent": "", "cues": ""}, window.__hyperframes.getVariables());
        const root = document.getElementById("root");
        HF.applyTheme(root, v);
        document.getElementById("ck-title").textContent = v.title;
        const items = HF.split(v.items);
        const list = document.getElementById("ck-list");
        items.forEach((t, i) => {
          const el = document.createElement("div"); el.className = "ck-item"; el.id = "ck-item-" + i;
          el.innerHTML = '<div class="ck-box"><svg viewBox="0 0 48 48"><path id="ck-p-' + i + '" d="M8 25 L19 36 L40 12"/></svg></div><div class="ck-t"></div>';
          el.querySelector(".ck-t").textContent = t; list.appendChild(el);
        });
        HF.refit(() => {
          HF.fitLines(document.getElementById("ck-title"), 2, 40);
          list.querySelectorAll(".ck-t").forEach(t => HF.fitLines(t, 3, 32));
          HF.fitBox(document.getElementById("ck"));
        });
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#ck", { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0);
        const D = HF.duration(root, 5.5), n = items.length;
        const at = HF.cues(v.cues, n, HF.spread(n, 0.7, D - 0.4, 1.2));
        items.forEach((_, i) => {
          const t = at[i];
          tl.fromTo("#ck-item-" + i, { x: -60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, t);
          tl.to("#ck-p-" + i, { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, t + 0.45);
          tl.fromTo("#ck-item-" + i + " .ck-box", { scale: 1 }, { scale: 1.2, duration: 0.12, yoyo: true, repeat: 1 }, t + 0.5);
        });
        tl.to("#ck", { y: 40, opacity: 0, duration: 0.4, ease: "power2.in" }, HF.exitAt(D, 0.4, at[n - 1] + 1));
        window.__timelines["dy-checklist"] = tl;
      </script>
    </template>
  </body>
</html>
