<!doctype html>
<html lang="zh-CN" data-composition-variables='[
  {"id":"name","type":"string","label":"姓名","default":"李老师"},
  {"id":"title","type":"string","label":"头衔","default":"10年短视频运营操盘手"},
  {"id":"tags","type":"string","label":"标签(用|分隔)","default":"千万播放|实战派|带货达人"},
  {"id":"accent","type":"color","label":"主色","default":"#25f4ee"}
]'>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "PingFang SC"; src: local("PingFang SC"), local("PingFangSC-Regular"); }
        @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"), local("微软雅黑"); }
        @font-face { font-family: "Noto Sans SC"; src: local("Noto Sans SC"), local("NotoSansSC-Regular"), local("Noto Sans CJK SC"); }
        @font-face { font-family: "WenQuanYi Zen Hei"; src: local("WenQuanYi Zen Hei"); }
        #root { position: absolute; inset: 0; font-family: "PingFang SC","Microsoft YaHei","Noto Sans SC","WenQuanYi Zen Hei",sans-serif; }
        #dy-lt-wrap { position: absolute; left: 60px; bottom: 480px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
        #dy-lt-tags { display: flex; gap: 12px; }
        .dy-lt-tag { font-size: 28px; font-weight: 700; color: #111; background: var(--accent); padding: 4px 16px; border-radius: 8px; }
        #dy-lt-bar { position: relative; display: flex; align-items: stretch; background: rgba(15,15,20,.9); border-radius: 16px; overflow: hidden; }
        #dy-lt-stripe { width: 14px; background: var(--accent); }
        #dy-lt-text { padding: 18px 36px 18px 28px; display: flex; flex-direction: column; gap: 4px; }
        #dy-lt-name { font-size: 62px; font-weight: 900; color: #fff; }
        #dy-lt-title { font-size: 32px; color: #c9c9d1; }
      </style>
      <div id="root" data-composition-id="dy-lower-third" data-width="1080" data-height="1920">
        <div id="dy-lt-wrap">
          <div id="dy-lt-tags"></div>
          <div id="dy-lt-bar"><div id="dy-lt-stripe"></div><div id="dy-lt-text"><div id="dy-lt-name"></div><div id="dy-lt-title"></div></div></div>
        </div>
      </div>
      <script>
        const v = Object.assign({ name:"李老师", title:"10年短视频运营操盘手", tags:"千万播放|实战派|带货达人", accent:"#25f4ee" }, window.__hyperframes.getVariables());
        document.getElementById("root").style.setProperty("--accent", v.accent);
        document.getElementById("dy-lt-name").textContent = v.name;
        document.getElementById("dy-lt-title").textContent = v.title;
        const tagBox = document.getElementById("dy-lt-tags");
        String(v.tags).split("|").filter(Boolean).forEach((t, i) => { const s = document.createElement("span"); s.className = "dy-lt-tag"; s.id = "dy-lt-tag-" + i; s.textContent = t; tagBox.appendChild(s); });
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#dy-lt-bar", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.5, ease: "power4.out" }, 0);
        tl.fromTo("#dy-lt-name", { x: -40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.25);
        tl.fromTo("#dy-lt-title", { x: -40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.4);
        tl.fromTo(".dy-lt-tag", { y: 30, opacity: 0, scale: 0.6 }, { y: 0, opacity: 1, scale: 1, duration: 0.35, stagger: 0.1, ease: "back.out(2)" }, 0.6);
        tl.to("#dy-lt-wrap", { x: -700, opacity: 0, duration: 0.4, ease: "power3.in" }, 3.5);
        window.__timelines["dy-lower-third"] = tl;
      </script>
    </template>
  </body>
</html>
