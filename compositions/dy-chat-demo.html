<!doctype html>
<html lang="zh-CN" data-composition-variables='[
  {"id": "prompt", "type": "string", "label": "用户提问", "default": "帮我用三句话讲清楚什么是大模型"},
  {"id": "reply", "type": "string", "label": "AI 回答", "default": "大模型就是读过海量文字的“超级接龙高手”:它根据上文预测下一个词,一路接下去就写出了文章、代码和答案。"},
  {"id": "aiName", "type": "string", "label": "AI 名称", "default": "AI 助手"},
  {"id": "hold", "type": "number", "label": "回答后停留(秒)", "default": 1.5},
  {"id": "theme", "type": "string", "label": "主题(留空跟随全局)", "default": ""},
  {"id": "accent", "type": "string", "label": "主色(留空用主题色)", "default": ""}
]'>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; font-family: var(--hf-font-body); }
        #cd { position: absolute; left: 60px; right: 170px; top: 380px; padding: 40px; display: flex; flex-direction: column; gap: 28px; }
        .cd-b { max-width: 88%; padding: 26px 32px; border-radius: 32px; font-size: 46px; font-weight: 700; line-height: 1.5; white-space: pre-wrap; }
        #cd-u { align-self: flex-end; background: var(--hf-accent); color: var(--hf-on-accent); border-bottom-right-radius: 8px; }
        #cd-a { align-self: flex-start; background: color-mix(in srgb, var(--hf-text) 10%, transparent); color: var(--hf-text); border-bottom-left-radius: 8px; }
        #cd-who { font-size: 32px; font-weight: 800; color: var(--hf-accent); margin-bottom: 8px; }
        #cd-dots { align-self: flex-start; display: flex; gap: 12px; padding: 22px 30px; background: color-mix(in srgb, var(--hf-text) 10%, transparent); border-radius: 28px; }
        #cd-dots i { width: 20px; height: 20px; border-radius: 50%; background: var(--hf-muted); display: block; }
      </style>
      <div id="root" data-composition-id="dy-chat-demo" data-width="1080" data-height="1920">
        <div class="hf-panel" id="cd"><div class="cd-b" id="cd-u"></div><div id="cd-dots"><i></i><i></i><i></i></div><div class="cd-b" id="cd-a"><div id="cd-who"></div><div id="cd-t"></div></div></div>
      </div>
      <script>
        const v = Object.assign({"prompt": "帮我用三句话讲清楚什么是大模型", "reply": "大模型就是读过海量文字的“超级接龙高手”:它根据上文预测下一个词,一路接下去就写出了文章、代码和答案。", "aiName": "AI 助手", "hold": 1.5, "theme": "", "accent": ""}, window.__hyperframes.getVariables());
        const root = document.getElementById("root");
        HF.applyTheme(root, v);
        // 打字效果:未出现的文字先以透明占位,版面从一开始就是最终大小
        const mkType = (el, text) => { el.innerHTML = '<span></span><span style="opacity:0"></span>'; const on = el.firstChild, off = el.lastChild; off.textContent = text; return n => { const k = Math.max(0, Math.min(text.length, Math.round(n))); on.textContent = text.slice(0, k); off.textContent = text.slice(k); }; };
        const prompt = String(v.prompt), reply = String(v.reply);
        document.getElementById("cd-who").textContent = "✦ " + v.aiName;
        const setP = mkType(document.getElementById("cd-u"), prompt), setR = mkType(document.getElementById("cd-t"), reply);
        const po = { n: 0 }, ro = { n: 0 };
        const pd = Math.min(2.5, prompt.length * 0.06), rd = Math.min(6, Math.max(1.5, reply.length * 0.05));
        setP(0); setR(0);
        // 字号按完整内容确定:超出安全区时整体缩小气泡文字
        HF.refit(() => {
          const cd = document.getElementById("cd"), bubbles = cd.querySelectorAll(".cd-b");
          bubbles.forEach(b => b.style.fontSize = "");
          let fs = 46;
          while (cd.offsetTop + cd.offsetHeight > 1520 && fs > 30) { fs -= 2; bubbles.forEach(b => b.style.fontSize = fs + "px"); }
          HF.fitBox(cd);
        });
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#cd", { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0);
        tl.fromTo("#cd-u", { x: 120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 0.4);
        tl.to(po, { n: prompt.length, duration: pd, ease: "none", onUpdate: () => setP(po.n) }, 0.7);
        const t1 = 0.7 + pd + 0.3;
        tl.fromTo("#cd-dots", { opacity: 0 }, { opacity: 1, duration: 0.2 }, t1);
        tl.fromTo("#cd-dots i", { opacity: 0.25 }, { opacity: 1, duration: 0.3, stagger: 0.15, yoyo: true, repeat: 2 }, t1);
        tl.to("#cd-dots", { opacity: 0, display: "none", duration: 0.15 }, t1 + 1.0);
        const t2 = t1 + 1.1;
        tl.fromTo("#cd-a", { x: -120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, t2);
        tl.to(ro, { n: reply.length, duration: rd, ease: "none", onUpdate: () => setR(ro.n) }, t2 + 0.3);
        tl.to("#cd", { y: 40, opacity: 0, duration: 0.4, ease: "power2.in" }, t2 + 0.3 + rd + Number(v.hold));
        window.__timelines["dy-chat-demo"] = tl;
      </script>
    </template>
  </body>
</html>
