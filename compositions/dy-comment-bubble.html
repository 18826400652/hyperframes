<!doctype html>
<html lang="zh-CN" data-composition-variables='[
  {"id":"nick","type":"string","label":"网友昵称","default":"爱吃瓜的小王"},
  {"id":"text","type":"string","label":"评论内容","default":"这个方法我试了,第二天就涨了500粉!"},
  {"id":"likes","type":"string","label":"点赞数","default":"2.3w"},
  {"id":"pinned","type":"boolean","label":"置顶","default":true}
]'>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "PingFang SC"; src: local("PingFang SC"), local("PingFangSC-Regular"); }
        @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"), local("微软雅黑"); }
        @font-face { font-family: "Noto Sans SC"; src: local("Noto Sans SC"), local("NotoSansSC-Regular"), local("Noto Sans CJK SC"); }
        @font-face { font-family: "WenQuanYi Zen Hei"; src: local("WenQuanYi Zen Hei"); }
        #root { position: absolute; inset: 0; font-family: "PingFang SC","Microsoft YaHei","Noto Sans SC","WenQuanYi Zen Hei",sans-serif; }
        #dy-cm-card { position: absolute; left: 60px; right: 60px; top: 520px; display: flex; gap: 24px; padding: 30px; background: #fff; border-radius: 28px; box-shadow: 0 16px 60px rgba(0,0,0,.45); }
        #dy-cm-avatar { width: 96px; height: 96px; border-radius: 50%; background: linear-gradient(135deg,#ffb347,#ff5f6d); flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 46px; font-weight: 900; }
        #dy-cm-body { flex: 1; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
        #dy-cm-head { display: flex; align-items: center; gap: 12px; }
        #dy-cm-nick { font-size: 32px; color: #6b6b75; font-weight: 600; }
        #dy-cm-pin { font-size: 24px; color: #fe2c55; border: 2px solid #fe2c55; padding: 0 10px; border-radius: 6px; }
        #dy-cm-text { font-size: 46px; color: #161823; font-weight: 700; line-height: 1.4; }
        #dy-cm-foot { display: flex; align-items: center; gap: 10px; color: #8a8a94; font-size: 30px; }
        #dy-cm-heart { color: #8a8a94; font-size: 40px; display: inline-block; }
      </style>
      <div id="root" data-composition-id="dy-comment-bubble" data-width="1080" data-height="1920">
        <div id="dy-cm-card">
          <div id="dy-cm-avatar"></div>
          <div id="dy-cm-body">
            <div id="dy-cm-head"><span id="dy-cm-nick"></span><span id="dy-cm-pin">置顶</span></div>
            <div id="dy-cm-text"></div>
            <div id="dy-cm-foot"><span id="dy-cm-heart">♥</span><span id="dy-cm-likes"></span></div>
          </div>
        </div>
      </div>
      <script>
        const v = Object.assign({ nick:"爱吃瓜的小王", text:"这个方法我试了,第二天就涨了500粉!", likes:"2.3w", pinned:true }, window.__hyperframes.getVariables());
        const $ = (id) => document.getElementById(id);
        $("dy-cm-nick").textContent = v.nick;
        $("dy-cm-avatar").textContent = Array.from(v.nick)[0] || "";
        $("dy-cm-text").textContent = v.text;
        $("dy-cm-likes").textContent = v.likes;
        if (!v.pinned) $("dy-cm-pin").style.display = "none";
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#dy-cm-card", { scale: 0.3, y: 200, opacity: 0, transformOrigin: "50% 100%" }, { scale: 1, y: 0, opacity: 1, duration: 0.5, ease: "back.out(1.8)" }, 0);
        tl.to("#dy-cm-heart", { color: "#fe2c55", duration: 0.1 }, 1.3);
        tl.fromTo("#dy-cm-heart", { scale: 1 }, { scale: 1.6, duration: 0.18, yoyo: true, repeat: 1, ease: "power2.out" }, 1.3);
        tl.to("#dy-cm-card", { y: -100, opacity: 0, duration: 0.35, ease: "power2.in" }, 3.5);
        window.__timelines["dy-comment-bubble"] = tl;
      </script>
    </template>
  </body>
</html>
