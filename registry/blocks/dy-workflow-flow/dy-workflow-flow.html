<!doctype html>
<html lang="zh-CN" data-composition-variables='[
  {"id": "title", "type": "string", "label": "标题", "default": "AI 工作流"},
  {"id": "steps", "type": "string", "label": "步骤(| 分隔)", "default": "输入选题|AI 写脚本|AI 配音配图|人工检查|一键发布"},
  {"id": "aiSteps", "type": "string", "label": "AI 步骤序号(逗号分隔,从1起)", "default": "2,3"},
  {"id": "theme", "type": "string", "label": "主题(留空跟随全局)", "default": ""},
  {"id": "accent", "type": "string", "label": "AI 步骤色(留空用主题色)", "default": ""}
]'>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; font-family: var(--hf-font-body); }
        #wf { position: absolute; left: 90px; right: 200px; top: 330px; display: flex; flex-direction: column; align-items: center; }
        #wf-title { max-width: 100%; text-align: center; font-family: var(--hf-font-title); font-size: 64px; font-weight: var(--hf-title-weight); line-height: 1.25; color: var(--hf-text); -webkit-text-stroke: 8px var(--hf-bg); paint-order: stroke fill; text-shadow: var(--hf-title-shadow); margin-bottom: 30px; }
        #wf-list { width: 100%; }
        .wf-n { width: 100%; display: flex; align-items: center; gap: 26px; padding: 26px 34px; font-size: 50px; font-weight: 900; line-height: 1.3; color: var(--hf-text); }
        .wf-n span { min-width: 0; }
        .wf-n b { flex: none; width: 70px; height: 70px; border-radius: 50%; background: color-mix(in srgb, var(--hf-text) 16%, transparent); color: var(--hf-text); display: flex; align-items: center; justify-content: center; font-size: 40px; }
        .wf-ai { border: 3px solid var(--hf-accent); box-shadow: 0 0 50px color-mix(in srgb, var(--hf-accent) 50%, transparent); }
        .wf-ai b { background: var(--hf-accent); color: var(--hf-on-accent); }
        .wf-ai::after { content: "AI"; flex: none; margin-left: auto; font-size: 30px; color: var(--hf-on-accent); background: var(--hf-accent); padding: 4px 18px; border-radius: 20px; }
        .wf-a { width: 8px; height: 56px; margin: 0 auto; background: linear-gradient(var(--hf-muted), var(--hf-accent)); border-radius: 4px; position: relative; transform-origin: top; }
        .wf-a::after { content: ""; position: absolute; bottom: -6px; left: -14px; border: 18px solid transparent; border-top-color: var(--hf-accent); border-bottom: 0; }
      </style>
      <div id="root" data-composition-id="dy-workflow-flow" data-width="1080" data-height="1920">
        <div id="wf"><div id="wf-title"></div><div id="wf-list"></div></div>
      </div>
      <script>
        const v = Object.assign({"title": "AI 工作流", "steps": "输入选题|AI 写脚本|AI 配音配图|人工检查|一键发布", "aiSteps": "2,3", "theme": "", "accent": ""}, window.__hyperframes.getVariables());
        const root = document.getElementById("root");
        HF.applyTheme(root, v);
        const title = document.getElementById("wf-title");
        if (v.title) title.textContent = v.title; else title.remove();
        const st = HF.split(v.steps), ai = String(v.aiSteps).split(",").map(Number), list = document.getElementById("wf-list");
        st.forEach((t, i) => {
          if (i) { const a = document.createElement("div"); a.className = "wf-a"; a.id = "wf-a-" + i; list.appendChild(a); }
          const n = document.createElement("div"); n.className = "wf-n hf-panel" + (ai.includes(i + 1) ? " wf-ai" : ""); n.id = "wf-n-" + i;
          const b = document.createElement("b"); b.textContent = i + 1;
          const s = document.createElement("span"); s.textContent = t;
          n.append(b, s); list.appendChild(n);
        });
        HF.refit(() => {
          if (title.isConnected) HF.fitLines(title, 2, 40);
          list.querySelectorAll(".wf-n span").forEach(s => HF.fitLines(s, 2, 30));
          HF.fitBox(document.getElementById("wf"));
        });
        const tl = gsap.timeline({ paused: true });
        if (title.isConnected) tl.fromTo("#wf-title", { y: -40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0);
        st.forEach((_, i) => {
          const t = 0.5 + i * 0.7;
          if (i) tl.fromTo("#wf-a-" + i, { scaleY: 0, opacity: 0 }, { scaleY: 1, opacity: 1, duration: 0.25, ease: "power2.out" }, t - 0.25);
          tl.fromTo("#wf-n-" + i, { x: -100, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, t);
        });
        tl.to("#wf", { y: 40, opacity: 0, duration: 0.4, ease: "power2.in" }, 0.5 + st.length * 0.7 + 2);
        window.__timelines["dy-workflow-flow"] = tl;
      </script>
    </template>
  </body>
</html>
