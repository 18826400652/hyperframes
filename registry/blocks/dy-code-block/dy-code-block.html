<!doctype html>
<html lang="zh-CN" data-composition-variables='[
  {"id": "file", "type": "string", "label": "文件名", "default": "demo.py"},
  {"id": "code", "type": "string", "label": "代码(| 分行,# 开头为注释,$ 开头为命令)", "default": "# 一行代码调用大模型|from openai import OpenAI|client = OpenAI()|print(client.chat(\"你好\"))"},
  {"id": "speed", "type": "number", "label": "每秒字符数", "default": 28},
  {"id": "theme", "type": "string", "label": "主题(留空跟随全局)", "default": ""},
  {"id": "accent", "type": "string", "label": "高亮色(留空用主题色)", "default": ""}
]'>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; font-family: var(--hf-font-body); }
        #cb { position: absolute; left: 50px; right: 160px; top: 440px; overflow: hidden; }
        #cb-bar { display: flex; align-items: center; gap: 14px; padding: 22px 28px; background: color-mix(in srgb, var(--hf-text) 6%, transparent); }
        #cb-bar i { flex: none; width: 26px; height: 26px; border-radius: 50%; display: block; }
        #cb-file { min-width: 0; margin-left: 16px; font-size: 32px; color: var(--hf-muted); font-family: var(--hf-font-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #cb-body { padding: 32px 36px 40px; font-family: var(--hf-font-mono); font-size: 38px; line-height: 1.7; color: var(--hf-text); }
        .cb-l { white-space: pre-wrap; word-break: break-all; min-height: 1.7em; }
        .cb-c { color: var(--hf-muted); } .cb-s { color: var(--hf-accent); }
      </style>
      <div id="root" data-composition-id="dy-code-block" data-width="1080" data-height="1920">
        <div class="hf-panel" id="cb"><div id="cb-bar"><i style="background:#ff5f56"></i><i style="background:#ffbd2e"></i><i style="background:#27c93f"></i><span id="cb-file"></span></div><div id="cb-body"></div></div>
      </div>
      <script>
        const v = Object.assign({"file": "demo.py", "code": "# 一行代码调用大模型|from openai import OpenAI|client = OpenAI()|print(client.chat(\"你好\"))", "speed": 28, "theme": "", "accent": ""}, window.__hyperframes.getVariables());
        const root = document.getElementById("root");
        HF.applyTheme(root, v);
        const mkType = (el, text) => { el.innerHTML = '<span></span><span style="opacity:0"></span>'; const on = el.firstChild, off = el.lastChild; off.textContent = text; return n => { const k = Math.max(0, Math.min(text.length, Math.round(n))); on.textContent = text.slice(0, k); off.textContent = text.slice(k); }; };
        document.getElementById("cb-file").textContent = v.file;
        const lines = String(v.code).split("|"), body = document.getElementById("cb-body"), setters = [];
        lines.forEach(t => { const el = document.createElement("div"); el.className = "cb-l" + (t[0] === "#" ? " cb-c" : t[0] === "$" ? " cb-s" : ""); body.appendChild(el); setters.push(mkType(el, t)); });
        const total = lines.reduce((a, l) => a + l.length + 1, 0), o = { n: 0 };
        const render = () => { let left = o.n; setters.forEach((s, i) => { s(Math.min(left, lines[i].length)); left = Math.max(0, left - lines[i].length - 1); }); };
        render();
        const dur = total / Math.max(1, Number(v.speed));
        // 代码过长时缩小字号,仍放不下再交给 fitBox
        HF.refit(() => {
          const cb = document.getElementById("cb");
          body.style.fontSize = "";
          let fs = 38;
          while (cb.offsetTop + cb.offsetHeight > 1520 && fs > 26) { fs -= 2; body.style.fontSize = fs + "px"; }
          HF.fitBox(cb);
        });
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#cb", { y: 70, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0);
        tl.to(o, { n: total, duration: dur, ease: "none", onUpdate: render }, 0.6);
        tl.to("#cb", { y: 40, opacity: 0, duration: 0.4, ease: "power2.in" }, 0.6 + dur + 1.8);
        window.__timelines["dy-code-block"] = tl;
      </script>
    </template>
  </body>
</html>
