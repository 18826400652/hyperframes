<!doctype html>
<html lang="zh-CN" data-composition-variables='[
  {"id": "src", "type": "string", "label": "截图路径(相对项目根目录;真实实测截图)", "default": "tests/media/sample-shot.png"},
  {"id": "ratio", "type": "number", "label": "截图高/宽(1080×1920 填 1.778,1080×2400 填 2.222)", "default": 1.778},
  {"id": "title", "type": "string", "label": "上方标题(可选)", "default": "", "maxChars": 12},
  {"id": "labels", "type": "string", "label": "标注文字,| 分隔,最多 4 条,和 boxes 一一对应", "default": "这里", "maxChars": 10},
  {"id": "boxes", "type": "string", "label": "标注区域,| 分隔,每条 x,y,w,h(截图的百分比)", "default": "10,10,60,4"},
  {"id": "textPx", "type": "number", "label": "截图里正文字的像素高(按截图原尺寸,手机截图约 40)", "default": 40},
  {"id": "cues", "type": "string", "label": "节拍(秒,| 分隔:每条标注一拍)", "default": ""},
  {"id": "cueNames", "type": "string", "label": "节拍对应的 @词(vd 自动填,标推近点用)", "default": ""},
  {"id": "enter", "type": "string", "label": "入场转场(vd 自动填,如 pan-left:0.6)", "default": ""},
  {"id": "exit", "type": "string", "label": "退场转场(vd 自动填)", "default": ""},
  {"id": "theme", "type": "string", "label": "主题(留空跟随全局)", "default": ""},
  {"id": "accent", "type": "string", "label": "强调色(留空用主题色)", "default": ""}
]'>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; font-family: var(--hf-font-body); color: var(--hf-text); }
        /* 取景窗:推近时画面只在 y 290–1160 里(上面是栏目标签,下面是字幕带),左右出血 */
        #pf-view { position: absolute; inset: 0; clip-path: inset(290px 0 760px 0); }
        /* 画布层:比画面大,镜头在上面推拉平移;点阵底让镜头运动看得出来 */
        #pf-stage { position: absolute; left: -540px; top: -960px; width: 2160px; height: 3840px; transform-origin: 0 0;
          background-image: radial-gradient(color-mix(in srgb, var(--hf-muted) 26%, transparent) 2px, transparent 2.6px); background-size: 36px 36px; }
        #pf-shot { position: absolute; overflow: hidden; }
        #pf-shot img { display: block; width: 100%; height: 100%; object-fit: cover; }
        #pf-tape { position: absolute; width: 150px; height: 40px; transform: rotate(-5deg); background: color-mix(in srgb, var(--hf-custom-highlight, var(--hf-accent)) 70%, transparent); }
        .pf-box { position: absolute; border-style: solid; border-color: var(--hf-custom-highlight, var(--hf-accent)); background: color-mix(in srgb, var(--hf-custom-highlight, var(--hf-accent)) 22%, transparent); transform-origin: 0 50%; }
        .pf-badge { position: absolute; width: 46px; height: 46px; border-radius: 50%; background: var(--hf-text); color: var(--hf-bg); font-size: 28px; font-weight: 900; display: flex; align-items: center; justify-content: center; }
        #pf-title { position: absolute; left: 90px; right: 90px; top: 300px; font-family: var(--hf-font-title); font-size: 72px; font-weight: 900; line-height: 1.1; white-space: nowrap; }
        #pf-lines { position: absolute; inset: 0; width: 1080px; height: 1920px; pointer-events: none; }
        #pf-lines line { stroke: var(--hf-text); stroke-width: 4; }
        #pf-lines circle { fill: var(--hf-text); }
        .pf-chip { position: absolute; padding: 14px 30px; border-radius: 14px; background: var(--hf-custom-highlight, var(--hf-accent)); color: var(--hf-custom-on-highlight, var(--hf-on-accent));
          font-size: 54px; font-weight: 900; line-height: 1.15; white-space: nowrap; box-shadow: 0 0 0 4px var(--hf-text), 10px 12px 0 var(--hf-text); }
        #pf-list { position: absolute; left: 520px; width: 480px; top: 470px; display: flex; flex-direction: column; gap: 34px; }
        .pf-item { display: flex; align-items: center; gap: 18px; font-size: 44px; font-weight: 900; line-height: 1.2; }
        .pf-item b { flex: none; width: 56px; height: 56px; border-radius: 50%; background: var(--hf-text); color: var(--hf-bg); font-size: 32px; display: flex; align-items: center; justify-content: center; }
        .pf-item span { padding: 4px 12px; background: linear-gradient(transparent 55%, var(--hf-custom-highlight, var(--hf-accent)) 55%); }
      </style>
      <div id="root" data-composition-id="dy-shot-proof" data-width="1080" data-height="1920">
        <div id="pf-view"><div id="pf-stage"><div id="pf-shot"><img id="pf-img" alt="" /></div><div id="pf-tape" data-layout-ignore></div></div></div>
        <div id="pf-title"></div>
        <svg id="pf-lines" viewBox="0 0 1080 1920"></svg>
        <div id="pf-chips"></div>
        <div id="pf-list"></div>
      </div>
      <script>
        const v = Object.assign({ src: "tests/media/sample-shot.png", ratio: 1.778, title: "", labels: "这里", boxes: "10,10,60,4", textPx: 40, cues: "", cueNames: "", enter: "", exit: "", theme: "", accent: "" }, window.__hyperframes.getVariables());
        const root = document.getElementById("root");
        HF.applyTheme(root, v);
        const D = HF.duration(root, 8);
        const SVG = "http://www.w3.org/2000/svg";
        const r2 = (x) => Math.round(x * 100) / 100;

        // ---- 版面:标题在上(避开栏目标签),截图贴纸居中,一屏能看全 ----
        const ratio = Number(v.ratio) > 0 ? Number(v.ratio) : 1.778;
        const hasTitle = !!String(v.title).trim();
        const top = hasTitle ? 420 : 330, bottom = 1130;
        const h = bottom - top, w = Math.round(h / ratio);
        const OFF = { x: 540, y: 960 }; // 画布层左上角在画面 (-540,-960),画布坐标 = 画面坐标 + OFF
        const shot = { x: 540 - w / 2 + OFF.x, y: top + OFF.y, w, h };
        const shotEl = document.getElementById("pf-shot");
        Object.assign(shotEl.style, { left: shot.x + "px", top: shot.y + "px", width: w + "px", height: h + "px" });
        HF.sticker(shotEl);
        document.getElementById("pf-img").src = v.src;
        Object.assign(document.getElementById("pf-tape").style, { left: shot.x + w / 2 - 75 + "px", top: shot.y - 26 + "px" });
        const titleEl = document.getElementById("pf-title");
        if (hasTitle) titleEl.textContent = v.title; else titleEl.remove();

        // ---- 标注:每条一个高亮框(画布里,跟着镜头缩放)+ 推近后屏幕上的引线和标签 ----
        const labels = HF.split(v.labels).slice(0, 4);
        const boxes = String(v.boxes).split("|").map((b) => b.split(",").map(Number)).slice(0, labels.length);
        const n = Math.min(labels.length, boxes.length);
        const names = String(v.cueNames || "").split("|");
        const textLayout = Number(v.textPx || 40) * w / 1080;           // 截图里一行字在布局里的高度
        const FOCUS = { x: 540, y: 600 };                                  // 推近后这处标注落在画面的位置
        const stage = document.getElementById("pf-stage");
        const lines = document.getElementById("pf-lines"), chips = document.getElementById("pf-chips");
        const notes = [];
        for (let i = 0; i < n; i++) {
          const [bx, by, bw, bh] = boxes[i];
          const r = { x: shot.x + bx / 100 * w, y: shot.y + by / 100 * h, w: bw / 100 * w, h: bh / 100 * h };
          // 推近倍数:字在屏幕上 ≥46px,区域宽度占 ~760px;两者取大
          const s = r2(Math.min(5, Math.max(46 / textLayout, Math.min(760 / r.w, 4))));
          const box = document.createElement("div");
          box.className = "pf-box";
          const pad = 8 / s;
          Object.assign(box.style, { left: r.x - pad + "px", top: r.y - pad + "px", width: r.w + 2 * pad + "px", height: r.h + 2 * pad + "px", borderWidth: 5 / s + "px", borderRadius: 8 / s + "px" });
          if (names[i]) { box.setAttribute("data-vd-zoom", "@" + names[i]); box.setAttribute("data-vd-zoom-text", String(r2(textLayout))); }
          stage.appendChild(box);
          // 推近后这一处在屏幕上的框,标签放在它下方,左右交替
          const sh = r.h * s, sw = r.w * s;
          const side = i % 2 === 0 ? -1 : 1;
          const chip = document.createElement("div");
          chip.className = "pf-chip";
          chip.textContent = labels[i];
          chips.appendChild(chip);
          const cy = FOCUS.y + sh / 2 + 120;
          const cx = 540 + side * 120;
          chip.style.top = cy + "px";
          chip.style.left = Math.max(80, Math.min(1000 - chip.offsetWidth, cx - chip.offsetWidth / 2)) + "px";
          const line = document.createElementNS(SVG, "line");
          const x1 = 540 + side * Math.min(sw / 2 - 30, 200), y1 = FOCUS.y + sh / 2 + 10;
          const x2 = chip.offsetLeft + chip.offsetWidth / 2, y2 = cy;
          line.setAttribute("x1", x1); line.setAttribute("y1", y1); line.setAttribute("x2", x2); line.setAttribute("y2", y2);
          const dot = document.createElementNS(SVG, "circle");
          dot.setAttribute("cx", x1); dot.setAttribute("cy", y1); dot.setAttribute("r", 9);
          lines.append(line, dot);
          // 镜头:让这一处的中心落在 FOCUS(画面坐标),画布原点在 (-540,-960)
          // 画布层在 (-540,-960)、原点 0 0:画面 x = -540 + camX + s·画布 x
          const cam = { x: r2(FOCUS.x + 540 - s * (r.x + r.w / 2)), y: r2(FOCUS.y + 960 - s * (r.y + r.h / 2)), scale: s };
          notes.push({ box, chip, line, dot, cam });
        }

        // ---- 收尾:镜头拉回、截图让到左边,右边列出几处标注 ----
        const list = document.getElementById("pf-list");
        const items = [];
        for (let i = 0; i < n; i++) {
          const it = document.createElement("div");
          it.className = "pf-item";
          it.innerHTML = `<b>${i + 1}</b><span></span>`;
          it.querySelector("span").textContent = labels[i];
          list.appendChild(it);
          items.push(it);
        }
        const badges = notes.map((nt, i) => {
          const b = document.createElement("div");
          b.className = "pf-badge";
          b.textContent = String(i + 1);
          const r = nt.box.style;
          b.style.left = parseFloat(r.left) - 23 + "px";
          b.style.top = parseFloat(r.top) - 23 + "px";
          stage.appendChild(b);
          return b;
        });
        const END_SCALE = 0.86;
        const END_HOLD = 2.2; // 收尾:1 秒拉回 + 列表出现后停留
        // 截图左边落在画面 x 80,竖直中心不动
        const endCam = { x: r2(620 - END_SCALE * shot.x), y: r2(960 + top + h / 2 - END_SCALE * (shot.y + h / 2)), scale: END_SCALE };

        // ---- 时间线 ----
        const beats = HF.cues(v.cues, n, HF.spread(n, 0.8, Math.max(n * 1.6, D - 2.2), 1.4));
        const tl = gsap.timeline({ paused: true });
        gsap.set([...notes.flatMap((x) => [x.box, x.chip]), ...badges, ...items], { opacity: 0 });
        notes.forEach((x) => gsap.set([x.line, x.dot], { opacity: 0 }));
        // 先排好每一处的镜头:推近落在 @词 附近;两处挨得近时镜头走得快一点(0.5–0.85 秒),不让镜头落后于口播
        const plan = [];
        notes.forEach((x, i) => {
          const gap = i ? beats[i] - beats[i - 1] : Infinity;
          const dur = i ? Math.min(0.85, Math.max(0.5, gap * 0.55)) : 0.85;
          const start = Math.max(0.1, beats[i] - dur * 0.5, i ? plan[i - 1].land + 0.15 : 0);
          plan.push({ start, dur, land: start + dur });
        });
        const keys = [{ t: 0, x: 0, y: 0, scale: 1 }];
        let free = 0.5;
        notes.forEach((x, i) => {
          const { start, dur, land } = plan[i];
          keys.push({ t: start, ...x.cam, dur });
          tl.fromTo(x.box, { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.35, ease: "power2.out", immediateRender: false }, land - 0.2);
          tl.to([x.line, x.dot], { opacity: 1, duration: 0.01 }, land - 0.05);
          HF.leader(tl, x.line, land - 0.05, 0.3);
          tl.fromTo(x.chip, { opacity: 0, scale: 0.6, y: 20 }, { opacity: 1, scale: 1, y: 0, duration: 0.4, ease: "back.out(1.4)", immediateRender: false }, land);
          // 标签至少停 0.6 秒;下一处的镜头开走时淡出。最后 END_HOLD 秒留给收尾(拉回 + 列表)
          const hide = i + 1 < n ? Math.max(plan[i + 1].start - 0.1, land + 0.6) : Math.max(land + 0.9, D - END_HOLD);
          tl.to([x.chip, x.line, x.dot], { opacity: 0, duration: 0.2, ease: "power2.in" }, hide - 0.2);
          free = hide;
        });
        const endAt = Math.max(free, 0.5);
        keys.push({ t: endAt, ...endCam, dur: 1.0 });
        HF.camera(tl, stage, keys);
        if (hasTitle) tl.to(titleEl, { opacity: 0, y: -30, duration: 0.25, ease: "power2.in" }, Math.max(0.1, (keys[1]?.t ?? endAt) - 0.1));
        if (hasTitle) tl.to(titleEl, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, endAt + 0.6);
        tl.to(badges, { opacity: 1, duration: 0.3, stagger: 0.12, ease: "power2.out" }, endAt + 0.7);
        tl.fromTo(items, { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.45, stagger: 0.15, ease: "power3.out", immediateRender: false }, endAt + 0.8);
        HF.panInOut(tl, root, { enter: v.enter, exit: v.exit, duration: D });
        window.__timelines["dy-shot-proof"] = tl;
      </script>
    </template>
  </body>
</html>
