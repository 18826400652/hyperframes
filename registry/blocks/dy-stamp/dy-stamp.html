<!doctype html>
<html lang="zh-CN" data-composition-variables='[
  {"id": "text", "type": "string", "label": "印章文字", "default": "你定"},
  {"id": "note", "type": "string", "label": "印章下方小字(可选)", "default": ""},
  {"id": "color", "type": "string", "label": "印章颜色(留空用强调色)", "default": ""},
  {"id": "rotate", "type": "number", "label": "倾斜角度(-20 到 20)", "default": -8},
  {"id": "theme", "type": "string", "label": "主题(留空跟随全局)", "default": ""},
  {"id": "accent", "type": "string", "label": "强调色(留空用主题色)", "default": ""},
  {"id": "cues", "type": "string", "label": "节拍(秒,| 分隔:章盖下去的时间;留空按默认节奏铺满整段)", "default": ""}
]'>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; font-family: var(--hf-font-body); }
        #st-wrap { position: absolute; left: 80px; right: 160px; top: 700px; display: flex; flex-direction: column; align-items: center; gap: 28px; }
        /* 印章:粗边框 + 大字;字和边框外加底色描边,压在任何画面上都清楚 */
        #st { max-width: 100%; padding: 18px 56px; border: 14px solid var(--st-color, var(--hf-accent)); border-radius: calc(var(--hf-radius) + 10px); color: var(--st-color, var(--hf-accent));
          font-family: var(--hf-font-title); font-size: 140px; font-weight: 900; line-height: 1.1; letter-spacing: 0.1em; text-align: center; overflow-wrap: anywhere;
          -webkit-text-stroke: 10px var(--hf-bg); paint-order: stroke fill; box-shadow: 0 0 0 6px var(--hf-bg), inset 0 0 0 6px var(--hf-bg); }
        #st-note { max-width: 100%; font-size: 40px; font-weight: 800; line-height: 1.4; text-align: center; color: var(--hf-text); -webkit-text-stroke: 8px var(--hf-bg); paint-order: stroke fill; overflow-wrap: anywhere; }
      </style>
      <div id="root" data-composition-id="dy-stamp" data-width="1080" data-height="1920">
        <div id="st-wrap"><div id="st"></div><div id="st-note"></div></div>
      </div>
      <script>
        const v = Object.assign({ text: "你定", note: "", color: "", rotate: -8, theme: "", accent: "" , "cues": ""}, window.__hyperframes.getVariables());
        const root = document.getElementById("root");
        HF.applyTheme(root, v);
        const st = document.getElementById("st"), note = document.getElementById("st-note");
        st.textContent = v.text || "你定";
        if (v.note) note.textContent = v.note; else note.remove();
        if (v.color && (typeof CSS === "undefined" || CSS.supports("color", v.color))) root.style.setProperty("--st-color", v.color);
        const r = Number(v.rotate), rot = Number.isFinite(r) ? Math.max(-20, Math.min(20, r)) : -8;
        HF.refit(() => {
          HF.fit(st, 840, 64);
          // 倾斜后印章的外框变高,按角度给下方小字留出空间
          const rad = Math.abs(rot) * Math.PI / 180;
          document.getElementById("st-wrap").style.gap = Math.round(28 + Math.sin(rad) * st.offsetWidth / 2) + "px";
          if (note.isConnected) HF.fitLines(note, 2, 30);
          HF.centerBox(document.getElementById("st-wrap"));
        });
        const m = HF.motion(root), D = HF.duration(root, 2.5);
        const [b0] = HF.cues(v.cues, 1, [0.2]);
        const tl = gsap.timeline({ paused: true });
        // 盖章:从放大、透明快速压下来,落地时轻微一震
        tl.fromTo(st, { opacity: 0, scale: 2.2, rotate: rot }, { opacity: 1, scale: 1, rotate: rot, duration: 0.2, ease: "power4.in" }, b0);
        tl.to(st, { x: 6, duration: 0.05, yoyo: true, repeat: 3, ease: "none" }, b0 + 0.2);
        if (note.isConnected) tl.fromTo(note, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: m.dur, ease: m.ease }, b0 + 0.4);
        tl.to("#st-wrap", { opacity: 0, duration: 0.3, ease: m.easeOut }, Math.max(b0 + 1, D - 0.35));
        window.__timelines["dy-stamp"] = tl;
      </script>
    </template>
  </body>
</html>
