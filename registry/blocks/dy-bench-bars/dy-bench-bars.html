<!doctype html>
<html lang="zh-CN" data-composition-variables='[
  {"id": "title", "type": "string", "label": "标题", "default": "数学推理能力评测"},
  {"id": "rows", "type": "string", "label": "名称|分数;分行", "default": "模型 A|92;模型 B|88;模型 C|76;模型 D|61"},
  {"id": "max", "type": "number", "label": "满分", "default": 100},
  {"id": "unit", "type": "string", "label": "单位", "default": "分"},
  {"id": "note", "type": "string", "label": "数据来源/备注", "default": "数据仅供参考,以官方公布为准"},
  {"id": "theme", "type": "string", "label": "主题(留空跟随全局)", "default": ""},
  {"id": "accent", "type": "string", "label": "领先色(留空用主题色)", "default": ""}
]'>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; font-family: var(--hf-font-body); }
        #bb { position: absolute; left: 60px; right: 170px; top: 400px; padding: 44px; }
        #bb-title { font-family: var(--hf-font-title); font-size: 60px; font-weight: var(--hf-title-weight); line-height: 1.25; color: var(--hf-text); margin-bottom: 30px; }
        .bb-r { display: flex; align-items: center; gap: 20px; margin-bottom: 26px; }
        .bb-n { flex: none; width: 190px; font-size: 40px; font-weight: 800; line-height: 1.25; color: var(--hf-text); }
        .bb-t { flex: 1; height: 54px; border-radius: calc(var(--hf-radius) * 0.5); background: color-mix(in srgb, var(--hf-text) 12%, transparent); overflow: hidden; }
        .bb-f { height: 100%; width: 0; border-radius: calc(var(--hf-radius) * 0.5); background: var(--hf-muted); }
        .bb-v { flex: none; width: 150px; text-align: right; font-size: 44px; font-weight: 900; color: var(--hf-text); font-variant-numeric: tabular-nums; white-space: nowrap; }
        .bb-best .bb-f { background: var(--hf-accent); }
        .bb-best .bb-v { color: var(--hf-accent); }
        #bb-note { font-size: 30px; line-height: 1.4; color: var(--hf-muted); margin-top: 6px; }
      </style>
      <div id="root" data-composition-id="dy-bench-bars" data-width="1080" data-height="1920">
        <div class="hf-panel" id="bb"><div id="bb-title"></div><div id="bb-list"></div><div id="bb-note"></div></div>
      </div>
      <script>
        const v = Object.assign({"title": "数学推理能力评测", "rows": "模型 A|92;模型 B|88;模型 C|76;模型 D|61", "max": 100, "unit": "分", "note": "数据仅供参考,以官方公布为准", "theme": "", "accent": ""}, window.__hyperframes.getVariables());
        const root = document.getElementById("root");
        HF.applyTheme(root, v);
        document.getElementById("bb-title").textContent = v.title;
        const note = document.getElementById("bb-note");
        if (v.note) note.textContent = v.note; else note.remove();
        const rs = HF.split(v.rows, ";").map(r => r.split("|")), mx = Math.max(1, Number(v.max));
        const best = Math.max(...rs.map(r => Number(r[1])));
        const list = document.getElementById("bb-list"), objs = [];
        rs.forEach((r, i) => {
          const el = document.createElement("div"); el.className = "bb-r"; el.id = "bb-r-" + i;
          el.innerHTML = '<div class="bb-n"></div><div class="bb-t"><div class="bb-f" id="bb-f-' + i + '"></div></div><div class="bb-v"></div>';
          el.children[0].textContent = r[0]; list.appendChild(el);
          if (Number(r[1]) === best) el.classList.add("bb-best");
          const o = { n: 0 }, vEl = el.children[2];
          const render = () => { vEl.textContent = Math.round(o.n) + v.unit; };
          render(); objs.push([o, render, Number(r[1])]);
        });
        HF.refit(() => {
          HF.fitLines(document.getElementById("bb-title"), 2, 36);
          list.querySelectorAll(".bb-n").forEach(n => HF.fitLines(n, 2, 24));
          if (note.isConnected) HF.fitLines(note, 2, 24);
          HF.fitBox(document.getElementById("bb"));
        });
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#bb", { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0);
        objs.forEach(([o, render, val], i) => {
          const t = 0.6 + i * 0.35;
          tl.fromTo("#bb-r-" + i, { x: -60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3 }, t);
          tl.to("#bb-f-" + i, { width: Math.min(100, val / mx * 100) + "%", duration: 1.1, ease: "power3.out" }, t + 0.1);
          tl.to(o, { n: val, duration: 1.1, ease: "power3.out", onUpdate: render }, t + 0.1);
        });
        const te = 0.6 + objs.length * 0.35 + 1.6;
        tl.to("#bb", { y: 40, opacity: 0, duration: 0.4, ease: "power2.in" }, te + 1.5);
        window.__timelines["dy-bench-bars"] = tl;
      </script>
    </template>
  </body>
</html>
