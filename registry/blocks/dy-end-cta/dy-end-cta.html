<!doctype html>
<html lang="zh-CN" data-composition-variables='[
  {"id":"headline","type":"string","label":"主文案(空格分隔,第一个词高亮)","default":"点赞 关注 不迷路"},
  {"id":"sub","type":"string","label":"副文案","default":"评论区告诉我,下期想看什么?"},
  {"id":"next","type":"string","label":"下期预告","default":"下期:3个爆款选题公式"},
  {"id":"theme","type":"string","label":"主题(留空跟随全局)","default":""},
  {"id":"accent","type":"string","label":"主色(留空用主题色)","default":""}
]'>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; font-family: var(--hf-font-body); }
        #dy-end-shade { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 30%, color-mix(in srgb, var(--hf-bg) 80%, transparent) 100%); }
        #dy-end-wrap { position: absolute; left: 60px; right: 200px; bottom: 480px; display: flex; flex-direction: column; gap: 22px; }
        #dy-end-head { font-family: var(--hf-font-title); font-size: 104px; font-weight: var(--hf-title-weight); color: var(--hf-text); -webkit-text-stroke: 8px var(--hf-bg); paint-order: stroke fill; text-shadow: var(--hf-title-shadow); line-height: 1.15; }
        #dy-end-head b { color: var(--hf-accent); font-weight: inherit; }
        #dy-end-sub { font-size: 44px; font-weight: 700; line-height: 1.4; color: var(--hf-text); -webkit-text-stroke: 6px var(--hf-bg); paint-order: stroke fill; }
        #dy-end-next { align-self: flex-start; max-width: 100%; font-size: 36px; font-weight: 800; line-height: 1.35; color: var(--hf-on-accent); background: var(--hf-accent); padding: 10px 28px; border-radius: 40px; }
        #dy-end-arrow { position: absolute; right: 50px; bottom: 440px; line-height: 1; font-size: 100px; color: var(--hf-text); -webkit-text-stroke: 6px var(--hf-bg); paint-order: stroke fill; }
      </style>
      <div id="root" data-composition-id="dy-end-cta" data-width="1080" data-height="1920">
        <div id="dy-end-shade"></div>
        <div id="dy-end-wrap"><div id="dy-end-head"></div><div id="dy-end-sub"></div><div id="dy-end-next"></div></div>
        <div id="dy-end-arrow">➜</div>
      </div>
      <script>
        const v = Object.assign({ headline:"点赞 关注 不迷路", sub:"评论区告诉我,下期想看什么?", next:"下期:3个爆款选题公式", theme:"", accent:"" }, window.__hyperframes.getVariables());
        const $ = (id) => document.getElementById(id);
        const root = $("root");
        HF.applyTheme(root, v);
        // 第一个词高亮;用文本节点拼装,不经过 innerHTML
        const head = $("dy-end-head");
        String(v.headline).split(" ").forEach((p, i) => {
          if (i > 0) head.append(" ");
          if (i === 0) { const b = document.createElement("b"); b.textContent = p; head.append(b); } else head.append(p);
        });
        $("dy-end-sub").textContent = v.sub;
        $("dy-end-next").textContent = v.next;
        if (!v.sub) $("dy-end-sub").remove();
        if (!v.next) $("dy-end-next").remove();
        HF.refit(() => {
          HF.fitLines(head, 3, 64);
          if ($("dy-end-sub")) HF.fitLines($("dy-end-sub"), 2, 32);
          if ($("dy-end-next")) HF.fitLines($("dy-end-next"), 2, 28);
        });
        const D = HF.duration(root, 4);
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#dy-end-shade", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
        tl.fromTo("#dy-end-head", { y: 80, opacity: 0, scale: 0.8 }, { y: 0, opacity: 1, scale: 1, duration: 0.55, ease: "back.out(1.6)" }, 0.2);
        if (v.sub) tl.fromTo("#dy-end-sub", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.55);
        if (v.next) tl.fromTo("#dy-end-next", { x: -80, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.8);
        tl.fromTo("#dy-end-arrow", { x: -30, opacity: 0.2 }, { x: 20, opacity: 1, duration: 0.4, yoyo: true, repeat: Math.max(1, Math.floor((D - 0.6) / 0.4) - 1), ease: "sine.inOut" }, 0.6);
        window.__timelines["dy-end-cta"] = tl;
      </script>
    </template>
  </body>
</html>
