<!doctype html>
<html lang="zh-CN" data-composition-variables='[
  {"id": "question", "type": "string", "label": "问题", "default": "你会选哪个?"},
  {"id": "optionA", "type": "string", "label": "选项A", "default": "先买再说"},
  {"id": "optionB", "type": "string", "label": "选项B", "default": "再等等看"},
  {"id": "pctA", "type": "number", "label": "A 占比%", "default": 64},
  {"id": "cta", "type": "string", "label": "引导语", "default": "评论区扣 A 或 B 👇"},
  {"id": "accent", "type": "color", "label": "A 色", "default": "#fe2c55"},
  {"id": "colorB", "type": "color", "label": "B 色", "default": "#25f4ee"}
]'>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Noto Sans SC Variable"; src: local("Noto Sans SC Variable"); }
        @font-face { font-family: "PingFang SC"; src: local("PingFang SC"), local("PingFangSC-Regular"); }
        @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"), local("微软雅黑"); }
        @font-face { font-family: "Noto Sans SC"; src: local("Noto Sans SC"), local("NotoSansSC-Regular"), local("Noto Sans CJK SC"); }
        @font-face { font-family: "WenQuanYi Zen Hei"; src: local("WenQuanYi Zen Hei"); }
        #root { position: absolute; inset: 0; font-family: "Noto Sans SC Variable","PingFang SC","Microsoft YaHei","Noto Sans SC","WenQuanYi Zen Hei",sans-serif; }
        #pl { position: absolute; left: 60px; right: 60px; top: 480px; display: flex; flex-direction: column; gap: 28px; }
        #pl-q { font-size: 76px; font-weight: 900; color: #fff; text-align: center; text-shadow: 0 6px 24px rgba(0,0,0,.7); margin-bottom: 12px; }
        .pl-opt { position: relative; height: 150px; border-radius: 28px; background: rgba(12,12,18,.88); overflow: hidden; display: flex; align-items: center; padding: 0 40px; gap: 24px; }
        .pl-bar { position: absolute; left: 0; top: 0; bottom: 0; width: 0; opacity: .85; }
        .pl-key { position: relative; width: 84px; height: 84px; border-radius: 50%; background: #fff; color: #111; font-size: 54px; font-weight: 900; display: flex; align-items: center; justify-content: center; flex: none; }
        .pl-name { position: relative; flex: 1; font-size: 54px; font-weight: 900; color: #fff; text-shadow: 0 3px 10px rgba(0,0,0,.6); }
        .pl-pct { position: relative; font-size: 76px; font-weight: 900; color: #fff; font-variant-numeric: tabular-nums; text-shadow: 0 3px 10px rgba(0,0,0,.6); }
        #pl-cta { text-align: center; font-size: 50px; font-weight: 900; color: #111; background: #ffe14d; border-radius: 40px; padding: 14px 0; margin-top: 8px; }
      </style>
      <div id="root" data-composition-id="dy-poll" data-width="1080" data-height="1920">
        <div id="pl"><div id="pl-q"></div>
          <div class="pl-opt" id="pl-a"><div class="pl-bar" id="pl-ba"></div><div class="pl-key">A</div><div class="pl-name" id="pl-na"></div><div class="pl-pct" id="pl-pa"></div></div>
          <div class="pl-opt" id="pl-b"><div class="pl-bar" id="pl-bb"></div><div class="pl-key">B</div><div class="pl-name" id="pl-nb"></div><div class="pl-pct" id="pl-pb"></div></div>
          <div id="pl-cta"></div></div>
      </div>
      <script>
        const hfFit = (el, maxW, minPx) => { el.style.fontSize = ""; el.style.whiteSpace = "nowrap"; const over = () => maxW ? el.scrollWidth > maxW : el.scrollWidth > el.clientWidth + 1; let fs = parseFloat(getComputedStyle(el).fontSize); while (over() && fs > minPx) { fs -= 2; el.style.fontSize = fs + "px"; } if (over()) el.style.whiteSpace = "normal"; };
        const hfFitBox = (el, bottom, minTop = 260) => { el.style.scale = ""; el.style.top = ""; const h = el.offsetHeight; if (el.offsetTop + h <= bottom) return; const top = Math.max(minTop, bottom - h); el.style.top = top + "px"; if (top + h > bottom) { el.style.transformOrigin = "50% 0"; el.style.scale = String(Math.max(0.5, (bottom - top) / h)); } };
        const v = Object.assign({"question": "你会选哪个?", "optionA": "先买再说", "optionB": "再等等看", "pctA": 64, "cta": "评论区扣 A 或 B 👇", "accent": "#fe2c55", "colorB": "#25f4ee"}, window.__hyperframes.getVariables());
        const root = document.getElementById("root");
        root.style.setProperty("--accent", v.accent);
        document.getElementById("pl-q").textContent = v.question;
        document.getElementById("pl-na").textContent = v.optionA;
        document.getElementById("pl-nb").textContent = v.optionB;
        document.getElementById("pl-cta").textContent = v.cta;
        document.getElementById("pl-ba").style.background = v.accent;
        document.getElementById("pl-bb").style.background = v.colorB;
        const pa = Math.max(0, Math.min(100, Number(v.pctA))), o = { n: 0 };
        const pA = document.getElementById("pl-pa"), pB = document.getElementById("pl-pb");
        const render = () => { pA.textContent = Math.round(o.n * pa) + "%"; pB.textContent = Math.round(o.n * (100 - pa)) + "%"; };
        render();
        const hfRefit = () => { hfFitBox(document.getElementById("pl"), 1520); };
        hfRefit(); if (document.fonts) document.fonts.ready.then(hfRefit);
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#pl-q", { y: -50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0);
        tl.fromTo("#pl-a", { x: -400, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.3);
        tl.fromTo("#pl-b", { x: 400, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.45);
        tl.fromTo("#pl-cta", { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2)" }, 0.9);
        tl.to("#pl-ba", { width: pa + "%", duration: 1.4, ease: "power3.out" }, 1.4);
        tl.to("#pl-bb", { width: (100 - pa) + "%", duration: 1.4, ease: "power3.out" }, 1.4);
        tl.to(o, { n: 1, duration: 1.4, ease: "power3.out", onUpdate: render }, 1.4);
        tl.to("#pl-cta", { scale: 1.06, duration: 0.3, yoyo: true, repeat: 5, ease: "sine.inOut" }, 3);
        tl.to("#pl", { opacity: 0, y: 40, duration: 0.4, ease: "power2.in" }, 5.5);
        window.__timelines["dy-poll"] = tl;
      </script>
    </template>
  </body>
</html>
