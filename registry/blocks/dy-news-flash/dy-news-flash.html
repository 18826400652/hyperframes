<!doctype html>
<html lang="zh-CN" data-composition-variables='[
  {"id": "tag", "type": "string", "label": "栏目", "default": "AI 快讯"},
  {"id": "date", "type": "string", "label": "日期", "default": "10 月 9 日"},
  {"id": "company", "type": "string", "label": "主体", "default": "某某公司"},
  {"id": "headline", "type": "string", "label": "标题", "default": "发布新一代多模态大模型"},
  {"id": "points", "type": "string", "label": "要点(| 分隔)", "default": "支持图文音视频输入|推理成本下降 50%|即日起开放 API"},
  {"id": "source", "type": "string", "label": "来源", "default": "来源:官方发布会"},
  {"id": "theme", "type": "string", "label": "主题(留空跟随全局)", "default": ""},
  {"id": "accent", "type": "string", "label": "主色(留空用主题色)", "default": ""}
]'>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; font-family: var(--hf-font-body); }
        #nf { position: absolute; left: 60px; right: 170px; top: 400px; overflow: hidden; }
        #nf-top { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 20px 36px; background: var(--hf-accent); color: var(--hf-on-accent); font-size: 42px; font-weight: 900; line-height: 1.3; }
        #nf-tag { min-width: 0; }
        #nf-date { flex: none; font-size: 34px; font-weight: 700; }
        #nf-main { padding: 36px 40px 30px; }
        #nf-co { font-size: 40px; font-weight: 900; line-height: 1.3; color: var(--hf-accent); }
        #nf-h { font-family: var(--hf-font-title); font-size: 64px; font-weight: var(--hf-title-weight); color: var(--hf-text); line-height: 1.3; margin: 8px 0 26px; }
        .nf-p { display: flex; gap: 16px; font-size: 44px; font-weight: 700; color: var(--hf-text); line-height: 1.4; margin-bottom: 16px; }
        .nf-p::before { content: "▶"; color: var(--hf-accent); font-size: 32px; padding-top: 8px; }
        #nf-src { font-size: 30px; line-height: 1.4; color: var(--hf-muted); margin-top: 18px; }
      </style>
      <div id="root" data-composition-id="dy-news-flash" data-width="1080" data-height="1920">
        <div class="hf-panel" id="nf"><div id="nf-top"><span id="nf-tag"></span><span id="nf-date"></span></div><div id="nf-main"><div id="nf-co"></div><div id="nf-h"></div><div id="nf-pts"></div><div id="nf-src"></div></div></div>
      </div>
      <script>
        const v = Object.assign({"tag": "AI 快讯", "date": "10 月 9 日", "company": "某某公司", "headline": "发布新一代多模态大模型", "points": "支持图文音视频输入|推理成本下降 50%|即日起开放 API", "source": "来源:官方发布会", "theme": "", "accent": ""}, window.__hyperframes.getVariables());
        const root = document.getElementById("root");
        HF.applyTheme(root, v);
        document.getElementById("nf-tag").textContent = "● " + v.tag;
        document.getElementById("nf-date").textContent = v.date;
        document.getElementById("nf-co").textContent = v.company;
        document.getElementById("nf-h").textContent = v.headline;
        document.getElementById("nf-src").textContent = v.source;
        const ps = HF.split(v.points), box = document.getElementById("nf-pts");
        ps.forEach((t, i) => { const d = document.createElement("div"); d.className = "nf-p"; d.id = "nf-p-" + i; d.textContent = t; box.appendChild(d); });
        HF.refit(() => {
          HF.fit(document.getElementById("nf-tag"), 0, 28);
          HF.fitLines(document.getElementById("nf-co"), 2, 30);
          HF.fitLines(document.getElementById("nf-h"), 3, 40);
          HF.fitBox(document.getElementById("nf"));
        });
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#nf", { x: -700, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0);
        tl.fromTo("#nf-co, #nf-h", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, stagger: 0.15 }, 0.5);
        ps.forEach((_, i) => tl.fromTo("#nf-p-" + i, { x: -40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 1.2 + i * 0.7));
        tl.fromTo("#nf-src", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 1.2 + ps.length * 0.7);
        tl.to("#nf", { x: 700, opacity: 0, duration: 0.45, ease: "power2.in" }, 1.2 + ps.length * 0.7 + 2);
        window.__timelines["dy-news-flash"] = tl;
      </script>
    </template>
  </body>
</html>
