<!doctype html>
<html lang="zh-CN" data-composition-variables='[
  {"id": "beforeLabel", "type": "string", "label": "以前", "default": "手动做一份 PPT"},
  {"id": "beforeValue", "type": "string", "label": "以前耗时", "default": "2 小时"},
  {"id": "afterLabel", "type": "string", "label": "用 AI", "default": "AI 一键生成"},
  {"id": "afterValue", "type": "string", "label": "AI 耗时", "default": "3 分钟"},
  {"id": "gain", "type": "string", "label": "提效文案", "default": "效率提升 40 倍"},
  {"id": "accent", "type": "color", "label": "主色", "default": "#25f4ee"}
]'>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Noto Sans SC Variable"; src: local("Noto Sans SC Variable"); }
        @font-face { font-family: "PingFang SC"; src: local("PingFang SC"), local("PingFangSC-Regular"); }
        @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"), local("微软雅黑"); }
        @font-face { font-family: "Noto Sans SC"; src: local("Noto Sans SC"), local("NotoSansSC-Regular"), local("Noto Sans CJK SC"); }
        @font-face { font-family: "WenQuanYi Zen Hei"; src: local("WenQuanYi Zen Hei"); }
        #root { position: absolute; inset: 0; font-family: "Noto Sans SC Variable","PingFang SC","Microsoft YaHei","Noto Sans SC","WenQuanYi Zen Hei",sans-serif; }
        #ba { position: absolute; left: 60px; right: 170px; top: 420px; display: flex; flex-direction: column; align-items: center; gap: 22px; }
        .ba-c { width: 100%; padding: 34px 40px; border-radius: 36px; text-align: center; }
        #ba-b { background: rgba(40,40,52,.92); border: 3px solid #555; }
        #ba-a { background: rgba(14,14,26,.94); border: 4px solid var(--accent); box-shadow: 0 0 70px rgba(37,244,238,.35); }
        .ba-k { font-size: 38px; font-weight: 900; padding: 4px 22px; border-radius: 12px; display: inline-block; }
        #ba-b .ba-k { background: #666; color: #fff; } #ba-a .ba-k { background: var(--accent); color: #111; }
        .ba-l { font-size: 50px; font-weight: 800; color: #fff; margin-top: 12px; }
        .ba-v { font-size: 130px; font-weight: 900; line-height: 1.15; }
        #ba-b .ba-v { color: #999; text-decoration: line-through; text-decoration-thickness: 8px; } #ba-a .ba-v { color: var(--accent); }
        #ba-arrow { font-size: 80px; color: var(--accent); line-height: 1; }
        #ba-gain { font-size: 54px; font-weight: 900; color: #111; background: #ffe14d; padding: 12px 44px; border-radius: 50px; }
      </style>
      <div id="root" data-composition-id="dy-before-after" data-width="1080" data-height="1920">
        <div id="ba"><div class="ba-c" id="ba-b"><span class="ba-k">以前</span><div class="ba-l" id="ba-bl"></div><div class="ba-v" id="ba-bv"></div></div>
          <div id="ba-arrow">⬇</div>
          <div class="ba-c" id="ba-a"><span class="ba-k">用 AI</span><div class="ba-l" id="ba-al"></div><div class="ba-v" id="ba-av"></div></div>
          <div id="ba-gain"></div></div>
      </div>
      <script>
        const hfFit = (el, maxW, minPx) => { el.style.fontSize = ""; el.style.whiteSpace = "nowrap"; const over = () => maxW ? el.scrollWidth > maxW : el.scrollWidth > el.clientWidth + 1; let fs = parseFloat(getComputedStyle(el).fontSize); while (over() && fs > minPx) { fs -= 2; el.style.fontSize = fs + "px"; } if (over()) el.style.whiteSpace = "normal"; };
        const hfFitBox = (el, bottom, minTop = 260) => { el.style.scale = ""; el.style.top = ""; const h = el.offsetHeight; if (el.offsetTop + h <= bottom) return; const top = Math.max(minTop, bottom - h); el.style.top = top + "px"; if (top + h > bottom) { el.style.transformOrigin = "50% 0"; el.style.scale = String(Math.max(0.5, (bottom - top) / h)); } };
        const v = Object.assign({"beforeLabel": "手动做一份 PPT", "beforeValue": "2 小时", "afterLabel": "AI 一键生成", "afterValue": "3 分钟", "gain": "效率提升 40 倍", "accent": "#25f4ee"}, window.__hyperframes.getVariables());
        const root = document.getElementById("root");
        root.style.setProperty("--accent", v.accent);
        document.getElementById("ba-bl").textContent = v.beforeLabel;
        document.getElementById("ba-bv").textContent = v.beforeValue;
        document.getElementById("ba-al").textContent = v.afterLabel;
        document.getElementById("ba-av").textContent = v.afterValue;
        document.getElementById("ba-gain").textContent = "🚀 " + v.gain;
        const hfRefit = () => { hfFit(document.getElementById("ba-bv"), 0, 56); hfFit(document.getElementById("ba-av"), 0, 56); hfFit(document.getElementById("ba-gain"), 900, 30); hfFitBox(document.getElementById("ba"), 1520); };
        hfRefit(); if (document.fonts) document.fonts.ready.then(hfRefit);
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#ba-b", { x: -400, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0);
        tl.fromTo("#ba-arrow", { scaleY: 0, opacity: 0 }, { scaleY: 1, opacity: 1, duration: 0.3 }, 1.2);
        tl.fromTo("#ba-a", { x: 400, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 1.5);
        tl.fromTo("#ba-av", { scale: 0.5 }, { scale: 1, duration: 0.5, ease: "elastic.out(1,0.5)" }, 1.9);
        tl.fromTo("#ba-gain", { scale: 0, rotate: -8 }, { scale: 1, rotate: 0, duration: 0.5, ease: "back.out(2.5)" }, 2.6);
        tl.to("#ba-gain", { scale: 1.06, duration: 0.3, yoyo: true, repeat: 3, ease: "sine.inOut" }, 3.2);
        tl.to("#ba", { y: 40, opacity: 0, duration: 0.4, ease: "power2.in" }, 5.1);
        window.__timelines["dy-before-after"] = tl;
      </script>
    </template>
  </body>
</html>
