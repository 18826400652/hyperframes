<!doctype html>
<html lang="zh-CN" data-composition-variables='[
  {"id":"label","type":"string","label":"说明","default":"单条视频最高播放量"},
  {"id":"value","type":"number","label":"目标数值","default":1286},
  {"id":"prefix","type":"string","label":"前缀","default":""},
  {"id":"suffix","type":"string","label":"单位","default":"万"},
  {"id":"delta","type":"string","label":"对比文案","default":"较上月 ↑ 320%"},
  {"id":"accent","type":"color","label":"主色","default":"#25f4ee"}
]'>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Noto Sans SC Variable"; src: local("Noto Sans SC Variable"); }
        @font-face { font-family: "PingFang SC"; src: local("PingFang SC"), local("PingFangSC-Regular"); }
        @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"), local("微软雅黑"); }
        @font-face { font-family: "Noto Sans SC"; src: local("Noto Sans SC"), local("NotoSansSC-Regular"), local("Noto Sans CJK SC"); }
        @font-face { font-family: "WenQuanYi Zen Hei"; src: local("WenQuanYi Zen Hei"); }
        #root { position: absolute; inset: 0; font-family: "Noto Sans SC Variable","PingFang SC","Microsoft YaHei","Noto Sans SC","WenQuanYi Zen Hei",sans-serif; display: flex; align-items: center; justify-content: center; }
        #dy-stat-card { max-width: 960px; display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 56px 72px; background: rgba(12,12,18,.88); border-radius: 40px; border: 4px solid var(--accent); box-shadow: 0 0 80px rgba(37,244,238,.25); }
        #dy-stat-label { text-align: center; font-size: 44px; color: #d8d8e0; font-weight: 700; }
        #dy-stat-num { font-size: 220px; font-weight: 900; color: var(--accent); line-height: 1.05; font-variant-numeric: tabular-nums; }
        #dy-stat-delta { font-size: 40px; font-weight: 800; color: #111; background: var(--accent); padding: 6px 24px; border-radius: 40px; }
      </style>
      <div id="root" data-composition-id="dy-stat-counter" data-width="1080" data-height="1920">
        <div id="dy-stat-card"><div id="dy-stat-label"></div><div id="dy-stat-num"></div><div id="dy-stat-delta"></div></div>
      </div>
      <script>
        const hfFit = (el, maxW, minPx) => { el.style.fontSize = ""; el.style.whiteSpace = "nowrap"; const over = () => maxW ? el.scrollWidth > maxW : el.scrollWidth > el.clientWidth + 1; let fs = parseFloat(getComputedStyle(el).fontSize); while (over() && fs > minPx) { fs -= 2; el.style.fontSize = fs + "px"; } if (over()) el.style.whiteSpace = "normal"; };
        const hfFitBox = (el, bottom, minTop = 260) => { el.style.scale = ""; el.style.top = ""; const h = el.offsetHeight; if (el.offsetTop + h <= bottom) return; const top = Math.max(minTop, bottom - h); el.style.top = top + "px"; if (top + h > bottom) { el.style.transformOrigin = "50% 0"; el.style.scale = String(Math.max(0.5, (bottom - top) / h)); } };
        const v = Object.assign({ label:"单条视频最高播放量", value:1286, prefix:"", suffix:"万", delta:"较上月 ↑ 320%", accent:"#25f4ee" }, window.__hyperframes.getVariables());
        document.getElementById("root").style.setProperty("--accent", v.accent);
        document.getElementById("dy-stat-label").textContent = v.label;
        document.getElementById("dy-stat-delta").textContent = v.delta;
        const numEl = document.getElementById("dy-stat-num");
        const o = { n: 0 };
        const render = () => { numEl.textContent = v.prefix + Math.round(o.n).toLocaleString("en-US") + v.suffix; };
        render();
        const hfRefit = () => { const keep = numEl.textContent; numEl.textContent = v.prefix + Math.round(Number(v.value)).toLocaleString("en-US") + v.suffix; hfFit(numEl, 816, 72); numEl.textContent = keep; hfFit(document.getElementById("dy-stat-label"), 816, 28); };
        hfRefit(); if (document.fonts) document.fonts.ready.then(hfRefit);
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#dy-stat-card", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.6)" }, 0);
        tl.to(o, { n: Number(v.value), duration: 1.8, ease: "power3.out", onUpdate: render }, 0.3);
        tl.fromTo("#dy-stat-delta", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 1.9);
        tl.fromTo("#dy-stat-num", { scale: 1 }, { scale: 1.08, duration: 0.15, yoyo: true, repeat: 1 }, 2.1);
        tl.to("#dy-stat-card", { scale: 0.8, opacity: 0, duration: 0.35, ease: "power2.in" }, 4.1);
        window.__timelines["dy-stat-counter"] = tl;
      </script>
    </template>
  </body>
</html>
