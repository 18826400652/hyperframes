<!doctype html>
<html lang="zh-CN" data-composition-variables='[
  {"id": "labels", "type": "string", "label": "章节(| 分隔)", "default": "开头|方法|案例|总结"},
  {"id": "duration", "type": "number", "label": "覆盖总时长(秒)", "default": 20},
  {"id": "accent", "type": "color", "label": "主色", "default": "#fe2c55"}
]'>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Noto Sans SC Variable"; src: local("Noto Sans SC Variable"); }
        @font-face { font-family: "PingFang SC"; src: local("PingFang SC"), local("PingFangSC-Regular"); }
        @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"), local("微软雅黑"); }
        @font-face { font-family: "Noto Sans SC"; src: local("Noto Sans SC"), local("NotoSansSC-Regular"), local("Noto Sans CJK SC"); }
        @font-face { font-family: "WenQuanYi Zen Hei"; src: local("WenQuanYi Zen Hei"); }
        #root { position: absolute; inset: 0; font-family: "Noto Sans SC Variable","PingFang SC","Microsoft YaHei","Noto Sans SC","WenQuanYi Zen Hei",sans-serif; }
        /* 半透明黑底:浅色画面上也能看清;整体止于 211px,下方留给 dy-ai-badge */
        #pb { position: absolute; left: 60px; right: 60px; top: 140px; display: flex; gap: 10px; padding: 8px 12px; border-radius: 16px; background: rgba(0,0,0,.55); }
        .pb-seg { flex: 1; min-width: 0; }
        .pb-track { height: 10px; border-radius: 5px; background: rgba(255,255,255,.3); overflow: hidden; }
        .pb-fill { height: 100%; width: 0; background: var(--accent); }
        .pb-lab { margin-top: 8px; text-align: center; font-size: 30px; font-weight: 800; line-height: 1.2; color: rgba(255,255,255,.82); text-shadow: 0 2px 8px rgba(0,0,0,.7); }
      </style>
      <div id="root" data-composition-id="dy-progress-bar" data-width="1080" data-height="1920">
        <div id="pb"></div>
      </div>
      <script>
        const v = Object.assign({"labels": "开头|方法|案例|总结", "duration": 20, "accent": "#fe2c55"}, window.__hyperframes.getVariables());
        const root = document.getElementById("root");
        root.style.setProperty("--accent", v.accent);
        const labs = String(v.labels).split("|").filter(Boolean), total = Math.max(1, Number(v.duration)), seg = total / labs.length;
        const bar = document.getElementById("pb");
        labs.forEach((t, i) => {
          const el = document.createElement("div"); el.className = "pb-seg";
          el.innerHTML = '<div class="pb-track"><div class="pb-fill" id="pb-f-' + i + '"></div></div><div class="pb-lab" id="pb-l-' + i + '"></div>';
          el.querySelector(".pb-lab").textContent = t; bar.appendChild(el);
        });
        // 标签始终单行:最宽的标签(含当前段放大 1.15 倍)放不下时，所有标签统一缩小字号(保持进度条高度不变)
        const fitLabs = () => {
          const els = bar.querySelectorAll(".pb-lab");
          els.forEach(e => { e.style.fontSize = ""; e.style.whiteSpace = "nowrap"; });
          let fs = 30;
          while (fs > 18 && [...els].some(e => e.scrollWidth * 1.15 > e.clientWidth + 1)) { fs -= 2; els.forEach(e => e.style.fontSize = fs + "px"); }
          els.forEach(e => e.style.whiteSpace = "");
        };
        fitLabs(); if (document.fonts) document.fonts.ready.then(fitLabs);
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#pb", { y: -40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0);
        labs.forEach((_, i) => {
          tl.to("#pb-f-" + i, { width: "100%", duration: seg, ease: "none" }, i * seg);
          tl.to("#pb-l-" + i, { color: "#ffffff", scale: 1.15, duration: 0.25 }, i * seg);
          if (i < labs.length - 1) tl.to("#pb-l-" + i, { color: "rgba(255,255,255,.82)", scale: 1, duration: 0.25 }, (i + 1) * seg);
        });
        tl.to("#pb", { opacity: 0, duration: 0.3 }, Math.max(0.4, total - 0.3));
        window.__timelines["dy-progress-bar"] = tl;
      </script>
    </template>
  </body>
</html>
