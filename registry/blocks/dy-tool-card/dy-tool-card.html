<!doctype html>
<html lang="zh-CN" data-composition-variables='[
  {"id": "name", "type": "string", "label": "工具名", "default": "某某 AI"},
  {"id": "logo", "type": "string", "label": "Logo 文字(1-2字)", "default": "AI"},
  {"id": "tagline", "type": "string", "label": "一句话介绍", "default": "30 秒把文字变成 PPT"},
  {"id": "tags", "type": "string", "label": "标签(| 分隔)", "default": "免费|中文|免注册"},
  {"id": "rating", "type": "string", "label": "评分", "default": "4.8"},
  {"id": "price", "type": "string", "label": "价格", "default": "基础功能免费"},
  {"id": "url", "type": "string", "label": "获取方式", "default": "评论区置顶 👆"},
  {"id": "theme", "type": "string", "label": "主题(留空跟随全局)", "default": ""},
  {"id": "accent", "type": "string", "label": "主色(留空用主题色)", "default": ""}
]'>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; font-family: var(--hf-font-body); }
        #tc { position: absolute; left: 60px; right: 170px; top: 460px; padding: 50px 44px; text-align: center; clip-path: none; }
        #tc-logo { width: 190px; height: 190px; margin: -145px auto 22px; border-radius: calc(var(--hf-radius) * 1.4); background: linear-gradient(135deg, var(--hf-accent), color-mix(in srgb, var(--hf-accent) 70%, var(--hf-accent-2))); color: var(--hf-on-accent); font-family: var(--hf-font-title); font-size: 84px; font-weight: 900; display: flex; align-items: center; justify-content: center; box-shadow: 0 16px 40px color-mix(in srgb, var(--hf-accent) 45%, transparent); }
        #tc-name { font-family: var(--hf-font-title); font-size: 76px; font-weight: var(--hf-title-weight); line-height: 1.2; color: var(--hf-text); }
        #tc-tag { font-size: 44px; font-weight: 700; color: var(--hf-muted); margin-top: 10px; line-height: 1.4; }
        #tc-tags { display: flex; justify-content: center; flex-wrap: wrap; gap: 14px; margin-top: 26px; }
        .tc-t { font-size: 36px; font-weight: 800; line-height: 1.35; color: var(--hf-accent); background: color-mix(in srgb, var(--hf-accent) 14%, transparent); padding: 8px 24px; border-radius: 40px; }
        #tc-meta { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px 36px; margin-top: 28px; font-size: 40px; font-weight: 800; line-height: 1.35; color: var(--hf-text); }
        #tc-star { color: var(--hf-accent); }
        #tc-url { margin-top: 28px; font-size: 44px; font-weight: 900; line-height: 1.35; color: var(--hf-on-accent); background: var(--hf-accent); border-radius: 40px; padding: 16px 24px; }
      </style>
      <div id="root" data-composition-id="dy-tool-card" data-width="1080" data-height="1920">
        <div class="hf-panel" id="tc"><div id="tc-logo"></div><div id="tc-name"></div><div id="tc-tag"></div><div id="tc-tags"></div><div id="tc-meta"><span id="tc-star"></span><span id="tc-price"></span></div><div id="tc-url"></div></div>
      </div>
      <script>
        const v = Object.assign({"name": "某某 AI", "logo": "AI", "tagline": "30 秒把文字变成 PPT", "tags": "免费|中文|免注册", "rating": "4.8", "price": "基础功能免费", "url": "评论区置顶 👆", "theme": "", "accent": ""}, window.__hyperframes.getVariables());
        const root = document.getElementById("root");
        HF.applyTheme(root, v);
        const $ = id => document.getElementById(id);
        $("tc-logo").textContent = v.logo;
        $("tc-name").textContent = v.name;
        $("tc-tag").textContent = v.tagline;
        $("tc-star").textContent = "★ " + v.rating;
        $("tc-price").textContent = v.price;
        const url = $("tc-url");
        if (v.url) url.textContent = v.url; else url.remove();
        const box = $("tc-tags");
        HF.split(v.tags).forEach(t => { const d = document.createElement("div"); d.className = "tc-t"; d.textContent = t; box.appendChild(d); });
        HF.refit(() => {
          HF.fit($("tc-logo"), 150, 40);
          HF.fit($("tc-name"), 0, 40); if ($("tc-name").style.whiteSpace === "normal") HF.fitLines($("tc-name"), 2, 40);
          HF.fitLines($("tc-tag"), 3, 30);
          if (url.isConnected) HF.fitLines(url, 2, 28);
          HF.fitBox($("tc"), 1520, 420);
        });
        const D = HF.duration(root, 5);
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#tc", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.55, ease: "back.out(1.6)" }, 0);
        tl.fromTo("#tc-logo", { rotate: -20, scale: 0.4 }, { rotate: 0, scale: 1, duration: 0.5, ease: "back.out(2)" }, 0.25);
        if (box.children.length) tl.fromTo(".tc-t", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, stagger: 0.12 }, 0.8);
        tl.fromTo(url.isConnected ? "#tc-meta, #tc-url" : "#tc-meta", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, stagger: 0.15 }, 1.3);
        if (url.isConnected) tl.to("#tc-url", { scale: 1.04, duration: 0.3, yoyo: true, repeat: 5, ease: "sine.inOut" }, 2);
        tl.to("#tc", { scale: 0.85, opacity: 0, duration: 0.4, ease: "power2.in" }, Math.max(3.8, D - 0.6));
        window.__timelines["dy-tool-card"] = tl;
      </script>
    </template>
  </body>
</html>
