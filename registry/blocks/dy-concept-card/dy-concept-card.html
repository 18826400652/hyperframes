<!doctype html>
<html lang="zh-CN" data-composition-variables='[
  {"id": "term", "type": "string", "label": "术语", "default": "Token"},
  {"id": "en", "type": "string", "label": "英文/读音", "default": "/ˈtoʊkən/ · 词元"},
  {"id": "plain", "type": "string", "label": "人话版", "default": "AI 读文字时切成的最小“积木块”,1 个汉字大约 1-2 个 Token。"},
  {"id": "analogy", "type": "string", "label": "打个比方", "default": "就像乐高:AI 不是整句整句地读,而是一块一块拼起来理解。"},
  {"id": "accent", "type": "color", "label": "主色", "default": "#25f4ee"}
]'>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Noto Sans SC Variable"; src: local("Noto Sans SC Variable"); }
        @font-face { font-family: "PingFang SC"; src: local("PingFang SC"), local("PingFangSC-Regular"); }
        @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"), local("微软雅黑"); }
        @font-face { font-family: "Noto Sans SC"; src: local("Noto Sans SC"), local("NotoSansSC-Regular"), local("Noto Sans CJK SC"); }
        @font-face { font-family: "WenQuanYi Zen Hei"; src: local("WenQuanYi Zen Hei"); }
        #root { position: absolute; inset: 0; font-family: "Noto Sans SC Variable","PingFang SC","Microsoft YaHei","Noto Sans SC","WenQuanYi Zen Hei",sans-serif; }
        #cc { position: absolute; left: 60px; right: 170px; top: 400px; padding: 52px 46px; background: rgba(14,14,26,.93); border-radius: 44px; border: 3px solid var(--accent); box-shadow: 0 0 80px rgba(37,244,238,.22); }
        #cc-term { font-size: 140px; font-weight: 900; color: var(--accent); line-height: 1.1; overflow-wrap: break-word; }
        #cc-en { font-size: 38px; color: #9a9ab8; font-weight: 700; margin-top: 6px; }
        #cc-line { height: 6px; width: 0; background: var(--accent); border-radius: 3px; margin: 28px 0; }
        .cc-k { display: inline-block; font-size: 32px; font-weight: 900; color: #111; background: var(--accent); padding: 4px 20px; border-radius: 10px; margin-bottom: 14px; }
        .cc-v { font-size: 46px; font-weight: 700; color: #fff; line-height: 1.5; margin-bottom: 30px; }
      </style>
      <div id="root" data-composition-id="dy-concept-card" data-width="1080" data-height="1920">
        <div id="cc"><div id="cc-term"></div><div id="cc-en"></div><div id="cc-line"></div>
          <div id="cc-b1"><div class="cc-k">人话版</div><div class="cc-v" id="cc-plain"></div></div>
          <div id="cc-b2"><div class="cc-k">打个比方</div><div class="cc-v" id="cc-ana" style="margin-bottom:0"></div></div></div>
      </div>
      <script>
        const hfFit = (el, maxW, minPx) => { el.style.fontSize = ""; el.style.whiteSpace = "nowrap"; const over = () => maxW ? el.scrollWidth > maxW : el.scrollWidth > el.clientWidth + 1; let fs = parseFloat(getComputedStyle(el).fontSize); while (over() && fs > minPx) { fs -= 2; el.style.fontSize = fs + "px"; } if (over()) el.style.whiteSpace = "normal"; };
        const hfFitBox = (el, bottom, minTop = 260) => { el.style.scale = ""; el.style.top = ""; const h = el.offsetHeight; if (el.offsetTop + h <= bottom) return; const top = Math.max(minTop, bottom - h); el.style.top = top + "px"; if (top + h > bottom) { el.style.transformOrigin = "50% 0"; el.style.scale = String(Math.max(0.5, (bottom - top) / h)); } };
        const v = Object.assign({"term": "Token", "en": "/ˈtoʊkən/ · 词元", "plain": "AI 读文字时切成的最小“积木块”,1 个汉字大约 1-2 个 Token。", "analogy": "就像乐高:AI 不是整句整句地读,而是一块一块拼起来理解。", "accent": "#25f4ee"}, window.__hyperframes.getVariables());
        const root = document.getElementById("root");
        root.style.setProperty("--accent", v.accent);
        document.getElementById("cc-term").textContent = v.term;
        document.getElementById("cc-en").textContent = v.en;
        document.getElementById("cc-plain").textContent = v.plain;
        document.getElementById("cc-ana").textContent = v.analogy;
        const hfRefit = () => { hfFit(document.getElementById("cc-term"), 0, 60); hfFitBox(document.getElementById("cc"), 1520); };
        hfRefit(); if (document.fonts) document.fonts.ready.then(hfRefit);
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#cc", { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.5)" }, 0);
        tl.fromTo("#cc-term", { x: -80, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0.3);
        tl.to("#cc-line", { width: "100%", duration: 0.5, ease: "power2.out" }, 0.7);
        tl.fromTo("#cc-b1", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 1.2);
        tl.fromTo("#cc-b2", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 2.4);
        tl.to("#cc", { scale: 0.85, opacity: 0, duration: 0.4, ease: "power2.in" }, 5.6);
        window.__timelines["dy-concept-card"] = tl;
      </script>
    </template>
  </body>
</html>
