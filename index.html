<!doctype html>
<html lang="zh-CN" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      #bg { position: absolute; inset: 0; background: linear-gradient(160deg, #1f2a44 0%, #3b1f4a 50%, #0f3b3b 100%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="40.0" data-width="1080" data-height="1920">
      <div id="bg"></div>
      <div id="host-dy-hook-title" data-composition-id="dy-hook-title" data-composition-src="compositions/dy-hook-title.html" data-start="0" data-duration="4" data-track-index="1" data-width="1080" data-height="1920" style="position:absolute;inset:0;z-index:2"></div>
      <div id="host-dy-lower-third" data-composition-id="dy-lower-third" data-composition-src="compositions/dy-lower-third.html" data-start="4" data-duration="4" data-track-index="2" data-width="1080" data-height="1920" style="position:absolute;inset:0;z-index:3"></div>
      <div id="host-dy-subtitle" data-composition-id="dy-subtitle" data-composition-src="compositions/dy-subtitle.html" data-start="8" data-duration="6" data-track-index="3" data-width="1080" data-height="1920" style="position:absolute;inset:0;z-index:4"></div>
      <div id="host-dy-rank-item" data-composition-id="dy-rank-item" data-composition-src="compositions/dy-rank-item.html" data-start="14" data-duration="4" data-track-index="4" data-width="1080" data-height="1920" style="position:absolute;inset:0;z-index:5"></div>
      <div id="host-dy-stat-counter" data-composition-id="dy-stat-counter" data-composition-src="compositions/dy-stat-counter.html" data-start="18" data-duration="4.5" data-track-index="5" data-width="1080" data-height="1920" style="position:absolute;inset:0;z-index:6"></div>
      <div id="host-dy-comment-bubble" data-composition-id="dy-comment-bubble" data-composition-src="compositions/dy-comment-bubble.html" data-start="22.5" data-duration="4" data-track-index="6" data-width="1080" data-height="1920" style="position:absolute;inset:0;z-index:7"></div>
      <div id="host-dy-action-bar" data-composition-id="dy-action-bar" data-composition-src="compositions/dy-action-bar.html" data-start="26.5" data-duration="5" data-track-index="7" data-width="1080" data-height="1920" style="position:absolute;inset:0;z-index:8"></div>
      <div id="host-dy-follow-card" data-composition-id="dy-follow-card" data-composition-src="compositions/dy-follow-card.html" data-start="31.5" data-duration="4.5" data-track-index="8" data-width="1080" data-height="1920" style="position:absolute;inset:0;z-index:9"></div>
      <div id="host-dy-end-cta" data-composition-id="dy-end-cta" data-composition-src="compositions/dy-end-cta.html" data-start="36.0" data-duration="4" data-track-index="9" data-width="1080" data-height="1920" style="position:absolute;inset:0;z-index:10"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.to("#bg", { filter: "hue-rotate(40deg)", duration: 40.0, ease: "none" }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
