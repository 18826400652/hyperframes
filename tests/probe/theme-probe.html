<!doctype html>
<html lang="zh-CN" data-composition-variables='[
  {"id": "theme", "type": "string", "label": "主题(留空跟随全局)", "default": ""}
]'>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; color: var(--hf-text); font-family: var(--hf-font-body); }
        #probe-out { position: absolute; left: 80px; top: 600px; font-size: 60px; padding: 16px 24px; background: var(--hf-bg); }
      </style>
      <div id="root" data-composition-id="theme-probe" data-width="1080" data-height="1920">
        <div id="probe-out"><span class="hf-em" id="probe-em">强调</span> <span id="probe-name"></span></div>
      </div>
      <script>
        const v = Object.assign({ theme: "" }, window.__hyperframes.getVariables());
        const root = document.getElementById("root");
        if (!window.HF) throw new Error("theme-probe: window.HF missing");
        HF.applyTheme(root, v);
        const theme = root.closest("[data-theme]") ? root.closest("[data-theme]").dataset.theme : "minimal";
        const expectBg = { minimal: "#000000", neon: "#06060d", editorial: "#f2ede3", bento: "#0a0a12" }[theme];
        const bg = getComputedStyle(root).getPropertyValue("--hf-bg").trim().toLowerCase();
        if (bg !== expectBg) throw new Error("theme-probe: --hf-bg for " + theme + " is '" + bg + "', expected " + expectBg);
        if (typeof HF.duration !== "function" || HF.duration(root, 0) !== 2) throw new Error("theme-probe: HF.duration should read host data-duration (2), got " + (typeof HF.duration === "function" ? HF.duration(root, 0) : "n/a") + " parent=" + (root.parentElement ? root.parentElement.tagName + "#" + root.parentElement.id + " attrs=" + [...root.parentElement.attributes].map(a => a.name).join(",") : "none"));
        const em = document.getElementById("probe-em");
        if (theme === "neon" && getComputedStyle(em).textShadow === "none") throw new Error("theme-probe: neon .hf-em has no glow");
        if (theme === "editorial" && getComputedStyle(em).backgroundImage === "none") throw new Error("theme-probe: editorial .hf-em has no marker");
        document.getElementById("probe-name").textContent = theme;
        if (v.theme) document.getElementById("probe-out").style.top = "900px";
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#probe-out", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0);
        window.__timelines["theme-probe"] = tl;
      </script>
    </template>
  </body>
</html>
